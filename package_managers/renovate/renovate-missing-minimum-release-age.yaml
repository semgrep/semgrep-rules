---
rules:
  - id: renovate-missing-minimum-release-age
    pattern-either:
      # Branch 1: Missing entirely
      - patterns:
          - pattern-inside: |
              "packageRules": [
                ...
              ]
          - pattern-either:
              - pattern: |
                  { ..., "matchPackageNames": [...], ... }
              - pattern: |
                  { ..., "matchPackagePatterns": [...], ... }
              - pattern: |
                  { ..., "matchDepTypes": [...], ... }
          - pattern-not: |
              {
                ...,
                "minimumReleaseAge": $AGE,
                ...
              }
          - pattern-not: |
              {
                ...,
                "minimumReleaseAge": false,
                ...
              }
          # Inherited from the top level, checked by Branch 4
          - pattern-not-inside: |
              {
                ...,
                "minimumReleaseAge": "$TOP",
                ...,
                "packageRules": [...],
                ...
              }
      # Branch 2: Present but too low
      - patterns:
          - pattern-inside: |
              "packageRules": [
                ...
              ]
          - pattern-regex: '"minimumReleaseAge":\s*"(?P<AGE>\d+) days?"'
          - metavariable-comparison:
              metavariable: $AGE
              comparison: int($AGE) < 7
          - focus-metavariable: $AGE
      # Branch 3: Invalid format (not matching "N days")
      - patterns:
          - pattern-inside: |
              "packageRules": [
                ...
              ]
          - pattern: |
              "minimumReleaseAge": "$AGE"
          - metavariable-regex:
              metavariable: $AGE
              regex: '^(?!\d+ days?$)'
          - focus-metavariable: $AGE
      # Branch 4: Top-level value too low or invalid format
      - patterns:
          - pattern-either:
              - pattern: |
                  {
                    ...,
                    "minimumReleaseAge": "$AGE",
                    ...,
                    "packageRules": [...],
                    ...
                  }
              - patterns:
                  - pattern: |
                      { ..., "minimumReleaseAge": "$AGE", ... }
                  - pattern-not-inside: |
                      "$KEY": { ... }
                  - pattern-not-inside: |
                      [ ... ]
          # Anything but "N days" with N >= 7
          - metavariable-regex:
              metavariable: $AGE
              regex: '^(?!0*([7-9]|[1-9]\d+) days?$)'
          - focus-metavariable: $AGE
    message: >-
      This Renovate configuration does not set a minimum release age or sets it too low.
      Newly published packages can be malicious or unstable.
      Add `"minimumReleaseAge": "7 days"` at the top level or within a
      `packageRules` entry to wait 7 days before proposing updates to
      newly published package versions.
      Set `"minimumReleaseAge": false` to set an exception for minimal release age for the package rule.
      Added in: v42
    languages:
      - json
    severity: MEDIUM
    paths:
      include:
        - "**/renovate.json"
        - "**/renovate.json5"
        - "**/.renovaterc"
        - "**/.renovaterc.json"
        - "**/.renovaterc.json5"
    metadata:
      category: security
      technology:
        - renovate
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://docs.renovatebot.com/configuration-options/#minimumreleaseage
