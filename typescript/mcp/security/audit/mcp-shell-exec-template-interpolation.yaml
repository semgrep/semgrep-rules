rules:
  - id: mcp-shell-exec-template-interpolation
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      A template literal with an interpolated value is passed to '$F'. When '$F' is
      child_process exec/execSync, a promisified alias of it, or a wrapper around them,
      the string is run by a shell, which re-parses the interpolated value; quoting the
      value does not neutralize it. In MCP servers this value is often a tool argument
      that the handler passes on to a helper function, a path that handler-scoped
      dataflow rules do not follow. Check whether a tool caller can influence the value.
      Prefer execFile() or spawn() with an argument array and without the shell option,
      so that arguments are passed to the program unparsed.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      category: security
      subcategory:
        - audit
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      technology:
        - mcp
        - typescript
        - node.js
      references:
        - https://modelcontextprotocol.io/specification/draft/basic/security_best_practices
        - https://nodejs.org/api/child_process.html#child_processexeccommand-options-callback
    pattern-either:
      # Bare call: child_process exec/execSync and the usual promisify(exec) alias names.
      # String.raw keeps backslashes but does not escape the interpolated value.
      - patterns:
          - pattern-either:
              - pattern: $F(`...${$X}...`, ...)
              - pattern: $F(String.raw`...${$X}...`, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(exec|execSync|execAsync|execPromise|execShell|shellExec|runShell)$
      # A promisify(exec) alias under any name, followed from its binding.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $F = $PROMISIFY(exec);
                  ...
              - pattern-inside: |
                  $F = $PROMISIFY($CP.exec);
                  ...
          - metavariable-regex:
              metavariable: $PROMISIFY
              regex: ^(\w+\.)?promisify$
          - pattern-either:
              - pattern: $F(`...${$X}...`, ...)
              - pattern: $F(String.raw`...${$X}...`, ...)
      # Member call: cp.exec, or a plugin/tool context object exposing a shell-backed exec.
      - patterns:
          - pattern-either:
              - pattern: $OBJ.$F(`...${$X}...`, ...)
              - pattern: $OBJ.$F(String.raw`...${$X}...`, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(exec|execSync|execAsync|execPromise|execShell|shellExec|runShell)$
          # RegExp.prototype.exec takes the subject string: skip regex literals,
          # new RegExp(...), names containing Regex/RegExp, and names ending in
          # Pattern/Matcher/Re (a suffix only, so patternRunner stays matched).
          - metavariable-regex:
              metavariable: $OBJ
              regex: ^(?!/)(?!new\s+RegExp\b)(?!.*(?:[Rr]e[Gg]ex|RegExp))(?!.*(?:[Pp]attern|[Mm]atcher|[a-z0-9]Re|^re|_[Rr][Ee])$)
          # SQLite/Postgres Database#exec runs SQL without a shell: skip bodies that
          # start with a SQL statement, optionally after SQL comments. Bash `select x in`
          # is shell syntax and stays matched. The leading whitespace and comments are an
          # atomic group so that backtracking cannot stop short of the statement keyword.
          # A String.raw tag in front of the literal is allowed.
          - pattern: $OBJ.$F($CMD, ...)
          - metavariable-regex:
              metavariable: $CMD
              regex: (?is)^(?:String\.raw)?`(?>\s*(?:(?:--.*?(?:\n|\\n)|/\*.*?\*/)\s*)*)(?!(?:pragma\s|select\s(?!\s*\w+\s+in\b)|insert\s+into|update\s+\w+\s+set|delete\s+from|create\s+(?:table|index|unique)|drop\s+(?:table|index)|alter\s+table|truncate\s+table|with\s+\w+\s+as\s*\())
