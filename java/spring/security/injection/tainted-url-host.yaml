rules:
  - id: tainted-url-host
    languages:
      - java
    severity: ERROR
    message: >-
      User data flows into the host portion of this manually-constructed URL.
      This could allow an attacker to send data to their own server,
      potentially exposing sensitive data such as cookies or authorization
      information sent with this request. They could also probe internal
      servers or other resources that the server runnig this code can access.
      (This is called server-side request forgery, or SSRF.) Do not allow
      arbitrary hosts. Instead, create an allowlist for approved hosts hardcode
      the correct host, or ensure that the user data can only affect the path or parameters.
    metadata:
      cwe: "CWE-918: SSRF"
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
      category: security
      technology:
        - java
        - spring
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $METHODNAME(..., @$REQ($LOOKUP) $TYPE
                  $SOURCE,...) {
                    ...
                  }
              - pattern-inside: |
                  $METHODNAME(..., @$REQ $TYPE
                  $SOURCE,...) {
                    ...
                  }
          - metavariable-regex:
              metavariable: $REQ
              regex: (RequestBody|PathVariable|RequestParam)
          # Numeric primitives can't carry a hostname, so exclude them so a
          # tainted @RequestParam("id") Integer that only ever ends up in the
          # path/query is not flagged as host-level SSRF.
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^(?!(Integer|Long|Float|Double|Char|Boolean|int|long|float|double|char|boolean))
          - pattern: $SOURCE
    pattern-sinks:
    - pattern-either:
      - pattern: new URL($ONEARG)
      - pattern: java.net.URI.create($ONEARG)
      - pattern: URI.create($ONEARG)
      # Spring RestTemplate. Every overload that takes a URL takes it as the
      # first positional argument, so any tainted value reaching that
      # position is a sink hit.
      - pattern: $RT.getForObject($ONEARG, ...)
      - pattern: $RT.getForEntity($ONEARG, ...)
      - pattern: $RT.postForObject($ONEARG, ...)
      - pattern: $RT.postForEntity($ONEARG, ...)
      - pattern: $RT.put($ONEARG, ...)
      - pattern: $RT.delete($ONEARG, ...)
      - pattern: $RT.patchForObject($ONEARG, ...)
      - pattern: $RT.exchange($ONEARG, ...)
      # Spring 6 WebClient and Java 11 HttpRequest builders.
      - pattern: $WC.uri($ONEARG)
      - pattern: $REQB.uri($ONEARG)
      # Apache HttpClient request constructors.
      - pattern: new org.apache.http.client.methods.HttpGet($ONEARG)
      - pattern: new org.apache.http.client.methods.HttpPost($ONEARG)
      - pattern: new HttpGet($ONEARG)
      - pattern: new HttpPost($ONEARG)
      - pattern: new HttpPut($ONEARG)
      - pattern: new HttpDelete($ONEARG)
      - pattern: new HttpPatch($ONEARG)
      - patterns:
        - pattern-either:
          - pattern: |
              "$URLSTR" + ...
          - pattern: |
              "$URLSTR".concat(...)
          - patterns:
            - pattern-inside: |
                StringBuilder $SB = new StringBuilder("$URLSTR");
                ...
            - pattern: $SB.append(...)
          - patterns:
            - pattern-inside: |
                $VAR = "$URLSTR";
                ...
            - pattern: $VAR += ...
          - patterns:
            - pattern: String.format("$URLSTR", ...)
            - pattern-not: String.format("$URLSTR", "...", ...)
          - patterns:
            - pattern-inside: |
                String $VAR = "$URLSTR";
                ...
            - pattern: String.format($VAR, ...)
        - metavariable-regex:
            metavariable: $URLSTR
            regex: http(s?)://%(v|s|q).*
