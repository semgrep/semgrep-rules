rules:
- id: unvalidated-redirect
  message: >-
    Application redirects to a destination URL specified by a user-supplied
    parameter that is not validated. This could direct users to malicious locations.
    Consider using an allowlist to validate URLs.
  metadata:
    cwe:
    - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#UNVALIDATED_REDIRECT
    asvs:
      section: 'V5: Validation, Sanitization and Encoding Verification Requirements'
      control_id: 5.1.5 Open Redirect
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v51-input-validation-requirements
      version: '4'
    category: security
    technology:
    - java
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - vuln
    impact: LOW
    likelihood: MEDIUM
    confidence: MEDIUM
  severity: WARNING
  languages: [java]
  pattern-either:
  - pattern: |
      $X $METHOD(...,HttpServletResponse $RES,...,String $URL,...) {
        ...
        $RES.sendRedirect($URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,String $URL,...,HttpServletResponse $RES,...) {
        ...
        $RES.sendRedirect($URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletRequest $REQ,...,HttpServletResponse $RES,...) {
        ...
        String $URL = $REQ.getParameter(...);
        ...
        $RES.sendRedirect($URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletResponse $RES,...,HttpServletRequest $REQ,...) {
        ...
        String $URL = $REQ.getParameter(...);
        ...
        $RES.sendRedirect($URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,String $URL,...) {
        ...
        HttpServletResponse $RES = ...;
        ...
        $RES.sendRedirect($URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletRequest $REQ,...,HttpServletResponse $RES,...) {
        ...
        $RES.sendRedirect($REQ.getParameter(...));
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletResponse $RES,...,HttpServletRequest $REQ,...) {
        ...
        $RES.sendRedirect($REQ.getParameter(...));
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletResponse $RES,...,String $URL,...) {
        ...
        $RES.addHeader("Location",$URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,String $URL,...,HttpServletResponse $RES,...) {
        ...
        $RES.addHeader("Location",$URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletRequest $REQ,...,HttpServletResponse $RES,...) {
        ...
        String $URL = $REQ.getParameter(...);
        ...
        $RES.addHeader("Location",$URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletResponse $RES,...,HttpServletRequest $REQ,...) {
        ...
        String $URL = $REQ.getParameter(...);
        ...
        $RES.addHeader("Location",$URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,String $URL,...) {
        ...
        HttpServletResponse $RES = ...;
        ...
        $RES.addHeader("Location",$URL);
        ...
      }
  - pattern: |
      $X $METHOD(...,HttpServletRequest $REQ,...,HttpServletResponse $RES,...) {
        ...
        $RES.addHeader("Location",$REQ.getParameter(...));
        ...
      }
  - pattern: |-
      $X $METHOD(...,HttpServletResponse $RES,...,HttpServletRequest $REQ,...) {
        ...
        $RES.addHeader("Location",$REQ.getParameter(...));
        ...
      }
  # Helper-returned redirect targets (fixes #3822, duplicate #3834):
  # the redirect target is read from the request inside a helper method and
  # only reaches the sink through the helper return value, so the
  # same-method getParameter patterns above never see it. These patterns
  # match the call site where a helper that receives the request returns
  # the target, assigned to a variable or used inline, and the target then
  # reaches sendRedirect or a Location header, optionally wrapped in
  # encodeRedirectURL. The request parameter is matched by type name
  # (any type containing "Request"), so HttpServletRequest and request
  # wrappers such as SecurityRequestWrapper (the CVE-2022-23618 call site
  # declares its request that way) both match. Requiring the request to be
  # passed to the helper keeps helpers that return constants out of scope.
  - patterns:
    - pattern-either:
      - pattern: |
          $X $METHOD(...,$RT $REQ,...,HttpServletResponse $RES,...) {
            ...
            String $URL = $HELPER(..., $REQ, ...);
            ...
            $RES.sendRedirect($URL);
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...,$RT $REQ,...) {
            ...
            String $URL = $HELPER(..., $REQ, ...);
            ...
            $RES.sendRedirect($URL);
            ...
          }
      - pattern: |
          $X $METHOD(...,$RT $REQ,...,HttpServletResponse $RES,...) {
            ...
            String $URL = $HELPER(..., $REQ, ...);
            ...
            $RES.sendRedirect($RES.encodeRedirectURL($URL));
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...,$RT $REQ,...) {
            ...
            String $URL = $HELPER(..., $REQ, ...);
            ...
            $RES.sendRedirect($RES.encodeRedirectURL($URL));
            ...
          }
      - pattern: |
          $X $METHOD(...,$RT $REQ,...,HttpServletResponse $RES,...) {
            ...
            String $URL = $HELPER(..., $REQ, ...);
            ...
            $RES.addHeader("Location",$URL);
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...,$RT $REQ,...) {
            ...
            String $URL = $HELPER(..., $REQ, ...);
            ...
            $RES.addHeader("Location",$URL);
            ...
          }
      - pattern: |
          $X $METHOD(...,$RT $REQ,...,HttpServletResponse $RES,...) {
            ...
            $RES.sendRedirect($HELPER(..., $REQ, ...));
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...,$RT $REQ,...) {
            ...
            $RES.sendRedirect($HELPER(..., $REQ, ...));
            ...
          }
      - pattern: |
          $X $METHOD(...,$RT $REQ,...,HttpServletResponse $RES,...) {
            ...
            $RES.sendRedirect($RES.encodeRedirectURL($HELPER(..., $REQ, ...)));
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...,$RT $REQ,...) {
            ...
            $RES.sendRedirect($RES.encodeRedirectURL($HELPER(..., $REQ, ...)));
            ...
          }
      - pattern: |
          $X $METHOD(...,$RT $REQ,...,HttpServletResponse $RES,...) {
            ...
            $RES.addHeader("Location",$HELPER(..., $REQ, ...));
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...,$RT $REQ,...) {
            ...
            $RES.addHeader("Location",$HELPER(..., $REQ, ...));
            ...
          }
    - metavariable-regex:
        metavariable: $RT
        regex: .*[Rr]equest.*
