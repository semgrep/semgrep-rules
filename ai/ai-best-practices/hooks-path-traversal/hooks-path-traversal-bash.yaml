rules:
  - id: hooks-path-traversal-bash
    mode: taint
    languages: [bash]
    severity: ERROR
    message: >-
      Hook input flows into a file path without validation. Claude Code and Cursor hooks
      receive JSON input that may contain user-controlled paths. An attacker
      could craft input with path traversal sequences (e.g., '../../etc/passwd')
      to read, modify, or delete arbitrary files. Resolving the path with
      realpath or readlink -f alone is not enough, since the resolved path may
      still point outside the intended directory: always verify the resolved
      path stays inside an allowlisted base directory (e.g. with a
      [[ $SAFE_PATH == $BASE_DIR/* ]] guard) before file operations.
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      category: security
      confidence: MEDIUM
      subcategory: [vuln]
      likelihood: MEDIUM
      impact: HIGH
      technology: [claude-code, cursor]
      references:
        - https://docs.anthropic.com/en/docs/claude-code/hooks
        - https://cursor.com/docs/agent/hooks
    pattern-sources:
      - pattern: |
          $VAR=$(... | jq ...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: cat $SINK
              - pattern: rm $SINK
              - pattern: cp $SINK ...
              - pattern: mv $SINK ...
          - pattern-not-inside: |
              $X=$(... | jq ...)
    pattern-sanitizers:
      # Resolving a path does not validate it: only treat a resolved path as
      # sanitized when it is also checked against an allowlisted base directory.
      # (The assignment must directly precede the guard: a `...` gap between
      # them breaks $P unification in bash patterns and over-sanitizes.)
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $P=$(realpath ...)
              if [[ $P == $BASE/* ]]; then
                ...
              fi
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $P=$(readlink -f ...)
              if [[ $P == $BASE/* ]]; then
                ...
              fi
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $P=$(realpath ...)
              if [[ $P != $BASE/* ]]; then
                ...
                exit ...
              fi
              ...
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $P=$(readlink -f ...)
              if [[ $P != $BASE/* ]]; then
                ...
                exit ...
              fi
              ...
