rules:
  - id: mcp-ssrf-python
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      User input from an MCP tool handler flows into an HTTP request URL without
      validation. An attacker could supply internal network URLs to access
      internal services (SSRF). Validate and restrict URLs with an allowlist:
      parse the URL with urllib.parse.urlparse() and check its hostname
      against the allowlist before making requests — parsing alone does not
      prevent SSRF.
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      category: security
      confidence: HIGH
      subcategory: [vuln]
      likelihood: MEDIUM
      impact: HIGH
      technology: [mcp]
      references:
        - https://modelcontextprotocol.io/specification/draft/basic/security_best_practices
    pattern-sources:
      - patterns:
          - pattern: |
              @$SERVER.tool()
              def $FUNC(..., $PARAM, ...):
                  ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern: requests.get($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: requests.post($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: requests.put($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: requests.delete($SINK, ...)
          - focus-metavariable: $SINK
      - patterns:
          - pattern: urllib.request.urlopen($SINK)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      # Parsing a URL does not validate it: only treat a parsed URL as
      # sanitized when its hostname is also checked against an allowlist.
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $P = urllib.parse.urlparse(...)
              ...
              if $P.hostname in $ALLOWLIST:
                ...
      - patterns:
          - pattern: $P
          - pattern-inside: |
              $P = urllib.parse.urlparse(...)
              ...
              if $P.hostname not in $ALLOWLIST:
                ...
                raise ...
              ...
