rules:
  - id: detect-groq
    languages:
      - python
    severity: INFO
    message: "Possibly found usage of AI: Groq"
    pattern-either:
      - pattern: import groq
      - pattern: from groq import $ANYTHING
      - pattern: Groq(...)
      - pattern: AsyncGroq(...)
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW
