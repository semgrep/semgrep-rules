# ==============================================
# SEMGREP DELPHI Pascal - Hamit CİBO - https://www.linkedin.com/in/ciboh/
# ==============================================
#
# Supported Files: .pas, .dpr, .dpk, .dfm, .inc, .ini, .xml, .conf, .pem, .key, .crt
# Version: v1.1
# ==============================================

rules:

  # ==========================================
  # PART 1: HARDCODED CREDENTIALS 
  # ==========================================

  # Rule 1: 
  - id: delphi-hardcoded-credentials
    message: "🚨 Hardcoded credential detected in Delphi code"
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dpk"
        - "*.inc"
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $VAR = '$VALUE'
          - pattern: |
              $TYPE $VAR = "$VALUE"
          - pattern: |
              const $VAR = '$VALUE'
          - pattern: |
              const $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i)(password|pass|pwd|secret|token|api.?key|auth|credential|username|user|wsUsername|wsPassword|wsSender|api_key|apikey|bearer|access_key)"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ".{2,}"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 2:
  - id: delphi-direct-assignment-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded credential in assignment"
    paths:
      include:
        - "*.pas"
        - "*.dpr"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|sifre|parola|secret|token|api_?key|username|user|wsUsername|wsPassword)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 3: 
  - id: delphi-parameter-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded credential as parameter"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Login|Connect|Authenticate|SetCredentials)[[:space:]]*\\([^,]*,[[:space:]]*['\"][^'\"]+['\"][^,)]*\\)"
    metadata:
      confidence: MEDIUM
      cwe: "CWE-798"

  # Rule 4:
  - id: delphi-hardcoded-password
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded password detected. Use environment variables or secure vault."
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.inc"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|sifre|parola)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{4,}['\"]"
      - pattern-not-regex: "(?i)(test|demo|example|dummy|sample)"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 5: 
  - id: delphi-hardcoded-username
    languages: [generic]
    severity: WARNING
    message: "⚠️ Hardcoded username detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(username|user|kullanici)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_]{3,}['\"]"
      - pattern-not-regex: "(?i)(test|demo|guest|anonymous)"
    metadata:
      confidence: MEDIUM

  # Rule 6: 
  - id: delphi-hardcoded-api-key
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded API key / token detected."
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(api[_-]?key|secret|token|bearer|access[_-]?key|client[_-]?secret)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_\\-]{16,}['\"]"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 7: 
  - id: delphi-api-key-token
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded API key or token"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(api[_-]?key|apikey|token|bearer|access_token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_\\-]{8,}['\"]"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 8: 
  - id: delphi-jwt-hardcoded
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded JWT token detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "eyJ[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}"
    metadata:
      confidence: HIGH

  # ==========================================
  # PART 2: CONNECTION STRINGS & DATABASE
  # ==========================================

  # Rule 9: 
  - id: delphi-connection-string-creds
    languages: [generic]
    severity: ERROR
    message: "🚨 Database connection string contains plaintext credentials."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
        - "*.inc"
    patterns:
      - pattern-regex: "(?i)(connectionstring|datasource|server|database|TADOConnection|TFDConnection|TOraSession).{0,150}(password|pwd|user id|uid|username)[[:space:]]*=[[:space:]]*[^;\\r\\n]+"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 10: 
  - id: delphi-connection-string-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Credentials in connection string"
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(User ID|UID|Password|PWD)[[:space:]]*=[[:space:]]*[^;]+"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 11: 
  - id: delphi-persist-security-info
    languages: [generic]
    severity: WARNING
    message: "⚠️ Persist Security Info=True may expose credentials in memory."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)Persist[[:space:]]+Security[[:space:]]+Info[[:space:]]*=[[:space:]]*True"
    metadata:
      confidence: HIGH
      cwe: "CWE-312"

  # Rule 12: 
  - id: delphi-oracle-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded Oracle credentials"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TOraSession|OracleSession|OracleConnection).{0,50}(Username|Password|User)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # ==========================================
  # PART 3: MESSAGE QUEUE & WEB SERVICE
  # ==========================================

  # Rule 13: 
  - id: delphi-message-queue-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded message queue credentials"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(tibco|mq|rabbitmq|activemq|ibmmq).{0,50}(password|pass|pwd|username|user)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # Rule 14: 
  - id: delphi-webservice-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded SOAP/Web Service credentials"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(soap|wsdl|webservice|ws_|THTTPRIO).{0,50}(username|user|password|pass|auth)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # ==========================================
  # PART 4: NETWORK PROTOCOLS (FTP/SMTP)
  # ==========================================

  # Rule 15: 
  - id: delphi-ftp-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 FTP credentials hardcoded."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TIdFTP|TftpClient|FTP).{0,50}(username|user|password|pass)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # Rule 16: 
  - id: delphi-smtp-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 SMTP/Email credentials hardcoded."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TIdSMTP|TIdMessage|SMTP|Mail).{0,50}(username|user|password|pass)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # ==========================================
  # PART 5: URL & HEADER EXPOSURE
  # ==========================================

  # Rule 17: 
  - id: delphi-url-credential-exposure
    languages: [generic]
    severity: ERROR
    message: "🚨 Credential or token exposed inside URL."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|token|apikey|secret|sifre|auth|accountid)=([A-Za-z0-9_\\-%]{4,})"
    metadata:
      confidence: HIGH
      cwe: "CWE-598"

  # Rule 18:
  - id: delphi-hardcoded-auth-header
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded authorization header or bearer token detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Authorization|Bearer|Basic)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9\\-_\\.:=/+]{12,}['\"]"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # ==========================================
  # PART 6: CONFIG & ENCODED SECRETS
  # ==========================================

  # Rule 19:
  - id: delphi-config-secret
    languages: [generic]
    severity: ERROR
    message: "🚨 Plaintext credential detected in config/XML/INI structure."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
        - "*.ini"
        - "*.xml"
        - "*.conf"
    patterns:
      - pattern-regex: "(?i)(password|pwd|secret|token|apikey|client_secret)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_@#\\-$%^&*!]{4,}"
      - pattern-not-regex: "(?i)(test|demo|example|sample|dummy)"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 20:
  - id: delphi-base64-secret
    languages: [generic]
    severity: WARNING
    message: "⚠️ Possible Base64 encoded credential detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|secret|token|apikey|credential|auth).{0,40}['\"][A-Za-z0-9+/]{24,}={0,2}['\"]"
    metadata:
      confidence: MEDIUM

  # Rule 21:
  - id: delphi-base64-credential
    languages: [generic]
    severity: WARNING
    message: "⚠️ Possible base64 encoded credential"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(password|secret|key|token|cred)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/]{16,}['\"]"
    metadata:
      confidence: MEDIUM

  # ==========================================
  # PART 7: CLOUD & CERTIFICATES
  # ==========================================

  # Rule 22:
  - id: delphi-cloud-access-key
    languages: [generic]
    severity: ERROR
    message: "🚨 Cloud access key detected in source code."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-either:
          - pattern-regex: "AKIA[0-9A-Z]{16}"
          - pattern-regex: "AIza[0-9A-Za-z\\-_]{35}"
          - pattern-regex: "ghp_[A-Za-z0-9]{30,}"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

  # Rule 23:
  - id: delphi-private-key-exposed
    languages: [generic]
    severity: ERROR
    message: "🚨 Private key or certificate hardcoded in source code."
    paths:
      include:
        - "*.pas"
        - "*.pem"
        - "*.key"
        - "*.crt"
    patterns:
      - pattern-regex: "-----BEGIN (RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----"
    metadata:
      confidence: HIGH
      cwe: "CWE-321"

  # Rule 24: 
  - id: delphi-private-key
    languages: [generic]
    severity: ERROR
    message: "🚨 Private key hardcoded"
    paths:
      include:
        - "*.pas"
        - "*.pem"
    patterns:
      - pattern-regex: "-----BEGIN.*PRIVATE KEY-----"
    metadata:
      confidence: HIGH

  # Rule 25: 
  - id: delphi-certificate-exposed
    languages: [generic]
    severity: WARNING
    message: "⚠️ Embedded certificate detected in source code."
    paths:
      include:
        - "*.pas"
        - "*.crt"
        - "*.pem"
    patterns:
      - pattern-regex: "-----BEGIN CERTIFICATE-----"
    metadata:
      confidence: MEDIUM

  # ==========================================
  # PART 8: INJECTIONS
  # ==========================================

  # Rule 26: 
  - id: delphi-sql-injection-concat
    languages: [generic]
    severity: ERROR
    message: "🚨 SQL Injection risk: String concatenation used in SQL query."
    paths:
      include:
        - "*.pas"
        - "*.dpr"
    patterns:
      - pattern-regex: "(?i)(SELECT|INSERT|UPDATE|DELETE).{0,100}(\\+|\\|\\|).{0,100}(Text|Edit|EditValue|FieldByName|ParamByName)"
    metadata:
      confidence: HIGH
      cwe: "CWE-89"

  # Rule 27: 
  - id: delphi-sql-format-injection
    languages: [generic]
    severity: ERROR
    message: "🚨 SQL Injection risk: Format() function used with user input."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)Format[[:space:]]*\\([[:space:]]*['\"].*(SELECT|INSERT|UPDATE|DELETE).*%s"
    metadata:
      confidence: HIGH
      cwe: "CWE-89"

  # Rule 28:
  - id: delphi-command-injection
    languages: [generic]
    severity: ERROR
    message: "🚨 Command Injection: User input passed to ShellExecute/CreateProcess."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(ShellExecute|WinExec|CreateProcess)[[:space:]]*\\([^)]{0,100}(\\+|\\.Text|Edit|ComboBox)"
    metadata:
      confidence: HIGH
      cwe: "CWE-78"

  # ==========================================
  # PART 9: WEAK CRYPTO
  # ==========================================

  # Rule 29:
  - id: delphi-weak-encryption-usage
    languages: [generic]
    severity: WARNING
    message: "⚠️ Weak encryption algorithm (DES/3DES/RC4). Use AES-256/CBC."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TDES|TripleDES|TCipherDES|TIdRC4|TRC4)\\.(Create|Encrypt|Decrypt)\\("
    metadata:
      confidence: HIGH
      cwe: "CWE-327"

  # Rule 30:
  - id: delphi-weak-hash-usage
    languages: [generic]
    severity: WARNING
    message: "⚠️ Weak hash algorithm (MD5/SHA1). Use SHA-256 or higher."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(THashMD5|TIdHashMD5|TIdHashSHA1|MD5Print|SHA1Digest)\\("
    metadata:
      confidence: HIGH
      cwe: "CWE-327"

  # ==========================================
  # PART 10: PROCESS & MALWARE
  # ==========================================

  # Rule 31:
  - id: delphi-process-injection
    languages: [generic]
    severity: ERROR
    message: "🚨 Process injection technique detected (possible malware)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(VirtualAllocEx|WriteProcessMemory|CreateRemoteThread|NtCreateThreadEx)[[:space:]]*\\("
    metadata:
      confidence: HIGH
      cwe: "CWE-94"

  # Rule 32:
  - id: delphi-keylogging
    languages: [generic]
    severity: ERROR
    message: "🚨 Keylogging capability detected (SetWindowsHookEx + WH_KEYBOARD)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)SetWindowsHookEx[[:space:]]*\\([^)]*WH_KEYBOARD"
    metadata:
      confidence: HIGH
      cwe: "CWE-359"

  # Rule 33:
  - id: delphi-registry-persistence
    languages: [generic]
    severity: WARNING
    message: "⚠️ Registry persistence: Writing to Run/RunOnce key."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Run|RunOnce).{0,100}Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run"
    metadata:
      confidence: HIGH
      cwe: "CWE-284"

  # ==========================================
  # PART 11: NETWORK & SSRF
  # ==========================================

  # Rule 34:
  - id: delphi-http-insecure-dynamic
    languages: [generic]
    severity: WARNING
    message: "⚠️ Insecure HTTP request (http://) or dynamic URL (potential SSRF)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*http://"
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*\\+"
    metadata:
      confidence: HIGH
      cwe: "CWE-319"

  # Rule 35:
  - id: delphi-http-no-tls
    languages: [generic]
    severity: WARNING
    message: "⚠️ Insecure HTTP (http://) usage"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "http://[a-zA-Z0-9]"
    metadata:
      confidence: HIGH

  # Rule 36:
  - id: delphi-ssrf-dynamic
    languages: [generic]
    severity: WARNING
    message: "⚠️ Potential SSRF - dynamic URL"
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*\\+"
    metadata:
      confidence: HIGH

  # ==========================================
  # PART 12: INFO DISCLOSURE & DEBUG
  # ==========================================

  # Rule 37:
  - id: delphi-exception-info-leak
    languages: [generic]
    severity: WARNING
    message: "⚠️ Exception.Message may leak internal information to user."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Exception\\.Message|ShowMessage|MessageDlg)"
    metadata:
      confidence: MEDIUM
      cwe: "CWE-209"

  # Rule 38:
  - id: delphi-debug-leftover
    languages: [generic]
    severity: INFO
    message: "ℹ️ Debug output function call (OutputDebugString/WriteLn) in production code."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(OutputDebugString|WriteLn)\\("
    metadata:
      confidence: MEDIUM

  # ==========================================
  # PART 13: FILE OPERATIONS & DANGEROUS APIS
  # ==========================================

  # Rule 39:
  - id: delphi-path-traversal
    languages: [generic]
    severity: ERROR
    message: "🚨 Path traversal pattern detected (../ or ..\\)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(\\.\\./|\\.\\.\\\\)"
    metadata:
      confidence: HIGH
      cwe: "CWE-22"

  # Rule 40:
  - id: delphi-dangerous-api
    languages: [generic]
    severity: WARNING
    message: "⚠️ Potentially dangerous API call (CreateOleObject, BlockInput, etc)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(CreateOleObject|URLDownloadToFile|BlockInput|keybd_event|mouse_event)\\("
    metadata:
      confidence: HIGH

  # ==========================================
  # PART 14: DFM FILES
  # ==========================================

  # Rule 41:
  - id: delphi-dfm-password
    languages: [generic]
    severity: ERROR
    message: "🚨 Password in DFM form"
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(Password|Pass|Pwd)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # Rule 42:
  - id: delphi-dfm-connection
    languages: [generic]
    severity: WARNING
    message: "⚠️ Connection string in DFM"
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)ConnectionString[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

  # Rule 43:
  - id: delphi-delete-file
    languages: [generic]
    severity: WARNING
    message: "⚠️ File deletion operation detected. Ensure it's intentional and logged."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(DeleteFile|TFile\\.Delete|RemoveDir)\\("
    metadata:
      confidence: HIGH
