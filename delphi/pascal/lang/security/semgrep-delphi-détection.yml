# =========================================================
# DANGEROUS API USAGE
# =========================================================

  - id: delphi-dangerous-api
    languages: [generic]
    severity: WARNING
    message: |
      Potentially dangerous API usage detected.

      These APIs can be abused for:
      - COM object abuse (CreateOleObject)
      - File download and execution (URLDownloadToFile)
      - Input simulation (keybd_event, mouse_event)
      - UI manipulation (BlockInput)

      Remediation:
      - Review if this API is necessary
      - Implement strict access controls
      - Consider safer alternatives
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(CreateOleObject|URLDownloadToFile|BlockInput|keybd_event|mouse_event)\\("
    metadata:
      category: security
      technology:
        - delphi
        - windows
      subcategory: [audit]
      cwe:
        - "CWE-694: Use of Multiple Resources with Duplicate Identifier"
      owasp:
        - "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class:
        - Dangerous Method or Function
      references:
        - https://attack.mitre.org/techniques/T1204/002/
    options:
      interfile: false

# =========================================================
# PRIVATE KEY EXPOSURE
# =========================================================

  - id: delphi-private-key
    languages: [generic]
    severity: ERROR
    message: |
      Private key embedded in source code.

      Private keys must NEVER be stored in source code or version control.

      Remediation:
      - Remove the embedded key immediately
      - Revoke and rotate exposed keys
      - Use hardware security modules (HSM) or key management services
    paths:
      include:
        - "*.pas"
        - "*.pem"
        - "*.key"
    patterns:
      - pattern-regex: "-----BEGIN (RSA|DSA|EC|OPENSSH|PGP)? ?PRIVATE KEY-----"
    metadata:
      category: security
      technology:
        - delphi
        - crypto
      subcategory: [vuln]
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      vulnerability_class:
        - Cryptographic Issues
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# EMBEDDED CERTIFICATE
# =========================================================

  - id: delphi-certificate
    languages: [generic]
    severity: WARNING
    message: |
      Embedded certificate detected in source code.

      Although public certificates can be embedded, private certificates should never be.

      Remediation:
      - For public CA certificates, this may be acceptable
      - For private certificates, move to secure storage
      - Consider certificate pinning for security
    paths:
      include:
        - "*.crt"
        - "*.pem"
        - "*.pas"
    patterns:
      - pattern-regex: "-----BEGIN CERTIFICATE-----"
    metadata:
      category: security
      technology:
        - delphi
        - crypto
      subcategory: [audit]
      cwe:
        - "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class:
        - Cryptographic Issues
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Pinning_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# DFM PASSWORD LEAK
# =========================================================

  - id: delphi-dfm-password
    languages: [generic]
    severity: ERROR
    message: |
      Password found inside DFM form file.

      DFM files are stored in plaintext and passwords are easily extracted.

      Remediation:
      - NEVER store passwords in DFM files
      - Move passwords to environment variables
      - Set password programmatically at runtime
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(Password|Pass|Pwd)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology:
        - delphi
        - dfm
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Hard-coded Secrets
      references:
        - https://docwiki.embarcadero.com/RADStudio/en/Working_with_Forms
    options:
      interfile: false

