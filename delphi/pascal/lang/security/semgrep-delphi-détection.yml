# ==============================================
# SEMGREP DELPHI Pascal - Hamit CİBO
# https://www.linkedin.com/in/ciboh/
# ==============================================
# Objective:
# - Maximum Delphi/Pascal security coverage
# - Minimum false positives
# - Secret + Injection + Malware + Weak Crypto + InfoLeak
#
# Supported Files:
# .pas .dpr .dpk .inc .dfm .ini .xml .conf .pem .key .crt
#
# Version: v1.0
# License: MIT
# ==============================================

rules:

# =========================================================
# HARDCODED CREDENTIALS
# =========================================================

  - id: delphi-hardcoded-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded credential detected in Delphi/Pascal code.

      Credentials such as passwords, API keys, tokens, usernames should never be hardcoded in source code.

      Remediation:
      - Use environment variables (GetEnvironmentVariable)
      - Use secure secret management (Azure Key Vault, AWS Secrets Manager, HashiCorp Vault)
      - Use encrypted configuration files
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dpk"
        - "*.inc"
        - "*.dfm"
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $VAR = '$VALUE'
          - pattern: |
              $TYPE $VAR = "$VALUE"
          - pattern: |
              const $VAR = '$VALUE'
          - pattern: |
              const $VAR = "$VALUE"
          - pattern: |
              $VAR := '$VALUE'
          - pattern: |
              $VAR := "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i)(password|passwd|pass|pwd|secret|token|api.?key|apikey|access.?key|client.?secret|auth|credential|username|user|uid|wsUsername|wsPassword|wsSender|bearer|authorization|sifre|parola)"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ".{2,}"
      - pattern-not-regex: "(?i)(test|demo|dummy|sample|example|guest|anonymous)"
    metadata:
      category: security
      technology:
        - delphi
        - pascal
        - embarcadero
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Hard-coded Secrets
        - Authentication Bypass
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
        - https://cwe.mitre.org/data/definitions/798.html
    options:
      interfile: false

# =========================================================
# DIRECT PASSWORD ASSIGNMENT
# =========================================================

  - id: delphi-direct-password-assignment
    languages: [generic]
    severity: ERROR
    message: |
      Direct hardcoded password assignment detected.

      Example: `password := 'mySecret123'`

      Remediation:
      - Move credentials to environment variables or external secret store
      - Use `GetEnvironmentVariable` to retrieve secrets at runtime
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|sifre|parola|secret|token|api_?key|username|user)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
      - pattern-not-regex: "(?i)(test|demo|dummy|sample|example)"
    metadata:
      category: security
      technology:
        - delphi
        - pascal
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Hard-coded Secrets
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# CONNECTION STRING CREDENTIALS
# =========================================================

  - id: delphi-connection-string-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Plaintext credentials detected inside database connection string.

      Example: `ConnectionString := 'User ID=sa;Password=admin123'`

      Remediation:
      - Use Integrated Security/Windows Authentication when possible
      - Use encrypted connection strings
      - Store connection strings in protected configuration files
      - Use environment variables for credentials
    paths:
      include:
        - "*.pas"
        - "*.dfm"
        - "*.inc"
    patterns:
      - pattern-regex: "(?i)(ConnectionString|TADOConnection|TFDConnection|TOraSession|OracleConnection|datasource|server|database).{0,200}(password|pwd|user id|uid|username)[[:space:]]*=[[:space:]]*[^;\\r\\n]+"
    metadata:
      category: security
      technology:
        - delphi
        - ado
        - firebird
        - oracle
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-312: Cleartext Storage of Sensitive Information"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Hard-coded Secrets
        - Sensitive Data Exposure
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Database_Security_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# SECURITY INFO PERSIST
# =========================================================

  - id: delphi-persist-security-info
    languages: [generic]
    severity: WARNING
    message: |
      'Persist Security Info=True' may expose credentials in memory.

      When set to True, it allows sensitive information to be persisted in memory,
      increasing the risk of credential exposure.

      Remediation:
      - Set Persist Security Info=False
      - Clear connection objects after use
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)Persist[[:space:]]+Security[[:space:]]+Info[[:space:]]*=[[:space:]]*True"
    metadata:
      category: security
      technology:
        - delphi
        - ado
      subcategory: [audit]
      cwe:
        - "CWE-312: Cleartext Storage of Sensitive Information"
        - "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class:
        - Sensitive Data Exposure
      references:
        - https://docs.microsoft.com/en-us/dotnet/api/system.data.sqlclient.sqlconnection.persistsecurityinfo
    options:
      interfile: false

# =========================================================
# URL CREDENTIAL EXPOSURE
# =========================================================

  - id: delphi-url-credential-exposure
    languages: [generic]
    severity: ERROR
    message: |
      Credential or token exposed inside URL.

      Example: `http://api.example.com?token=12345` or `?password=secret`

      Remediation:
      - Use HTTP Authorization headers instead of URL parameters
      - Use POST requests for sensitive data
      - Encrypt sensitive parameters if they must be in URLs
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|token|apikey|secret|auth|accountid|sifre)=([A-Za-z0-9_\\-%]{3,})"
    metadata:
      category: security
      technology:
        - delphi
        - http
      subcategory: [vuln]
      cwe:
        - "CWE-598: Use of GET Request Method With Sensitive Query Strings"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class:
        - Sensitive Data Exposure
      references:
        - https://owasp.org/www-community/vulnerabilities/Information_exposure_through_query_strings_in_url
    options:
      interfile: false

# =========================================================
# HARDCODED AUTH HEADER
# =========================================================

  - id: delphi-hardcoded-auth-header
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded Authorization header or Bearer token detected.

      Example: `Authorization := 'Bearer eyJhbG...'`

      Remediation:
      - Generate tokens dynamically at runtime
      - Store tokens in secure secret management
      - Use short-lived tokens with refresh mechanisms
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(Authorization|Bearer|Basic)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9\\-_\\.:=/+]{8,}['\"]"
    metadata:
      category: security
      technology:
        - delphi
        - http
        - rest
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-259: Use of Hard-coded Password"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Hard-coded Secrets
        - Authentication Bypass
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# CONFIG FILE SECRETS
# =========================================================

  - id: delphi-config-secret
    languages: [generic]
    severity: ERROR
    message: |
      Plaintext credential detected in configuration structure (INI/XML/CONF).

      Remediation:
      - Use encrypted configuration sections
      - Store sensitive config values in environment variables
      - Use dedicated secret management tools
      - Restrict access to configuration files
    paths:
      include:
        - "*.ini"
        - "*.xml"
        - "*.conf"
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|pwd|secret|token|apikey|client_secret|access_key)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_@#\\-$%^&*!]{3,}"
      - pattern-not-regex: "(?i)(test|demo|dummy|sample|example)"
    metadata:
      category: security
      technology:
        - delphi
        - config
      subcategory: [vuln]
      cwe:
        - "CWE-312: Cleartext Storage of Sensitive Information"
        - "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Sensitive Data Exposure
        - Hard-coded Secrets
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Configuration_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# BASE64 ENCODED SECRET
# =========================================================

  - id: delphi-base64-secret
    languages: [generic]
    severity: WARNING
    message: |
      Possible Base64 encoded credential detected.

      Attackers can easily decode Base64 strings to reveal plaintext secrets.

      Remediation:
      - Never store secrets in Base64 without proper encryption
      - Use proper secret management solutions
      - If decoding at runtime, ensure proper access controls
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|secret|token|apikey|credential|auth).{0,40}['\"][A-Za-z0-9+/]{16,}={0,2}['\"]"
    metadata:
      category: security
      technology:
        - delphi
      subcategory: [audit]
      cwe:
        - "CWE-312: Cleartext Storage of Sensitive Information"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class:
        - Sensitive Data Exposure
        - Hard-coded Secrets
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# JWT TOKEN HARDCODED
# =========================================================

  - id: delphi-jwt-token
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded JWT (JSON Web Token) detected.

      JWT tokens contain encoded authentication and authorization claims.
      Hardcoded tokens can be extracted and used for authentication bypass.

      Remediation:
      - Generate JWT tokens dynamically at runtime
      - Use short expiration times
      - Implement token refresh mechanisms
      - Store tokens in secure memory only
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "eyJ[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}"
    metadata:
      category: security
      technology:
        - delphi
        - jwt
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Hard-coded Secrets
        - Authentication Bypass
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# CLOUD ACCESS KEYS
# =========================================================

  - id: delphi-cloud-access-key
    languages: [generic]
    severity: ERROR
    message: |
      Cloud service access key detected in source code.

      Detected patterns: AWS Keys (AKIA), Google API (AIza), GitHub Token (ghp_)

      Remediation:
      - NEVER commit cloud keys to version control
      - Use IAM roles or service accounts
      - Rotate exposed keys immediately
      - Use cloud-native secret management
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-either:
          - pattern-regex: "AKIA[0-9A-Z]{16}"
          - pattern-regex: "AIza[0-9A-Za-z\\-_]{35}"
          - pattern-regex: "ghp_[A-Za-z0-9]{30,}"
    metadata:
      category: security
      technology:
        - delphi
        - aws
        - google
        - github
      subcategory: [vuln]
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
        - "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      vulnerability_class:
        - Hard-coded Secrets
        - Cloud Misconfiguration
      references:
        - https://docs.aws.amazon.com/general/latest/gr/aws-access-keys-best-practices.html
    options:
      interfile: false

