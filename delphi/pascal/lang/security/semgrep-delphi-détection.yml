# =========================================================
# SQL INJECTION - CONCATENATION
# =========================================================

  - id: delphi-sql-injection-concat
    languages: [generic]
    severity: ERROR
    message: |
      SQL Injection vulnerability via string concatenation.

      Example: `SQL.Text := 'SELECT * FROM users WHERE id = ' + Edit1.Text`

      Remediation:
      - USE PARAMETERIZED QUERIES ALWAYS
      - Example: `SQL.Text := 'SELECT * FROM users WHERE id = :id'; Params.ParamByName('id').Value := Edit1.Text;`
      - Never concatenate user input directly into SQL strings
    paths:
      include:
        - "*.pas"
        - "*.dpr"
    patterns:
      - pattern-regex: "(?i)(SELECT|INSERT|UPDATE|DELETE).*(\\+|\\|\\|).*(Text|Edit|EditValue|FieldByName|ParamByName|QuotedStr)"
    metadata:
      category: security
      technology:
        - delphi
        - sql
      subcategory: [vuln]
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - SQL Injection
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# SQL INJECTION - FORMAT FUNCTION
# =========================================================

  - id: delphi-sql-format-injection
    languages: [generic]
    severity: ERROR
    message: |
      SQL Injection vulnerability via Format() function.

      Example: `Format('SELECT * FROM users WHERE id = %s', [Edit1.Text])`

      Remediation:
      - USE PARAMETERIZED QUERIES
      - Format() does NOT provide SQL injection protection
      - Always use parameters: `WHERE id = :id`
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)Format\\s*\\(\\s*['\"].*(SELECT|INSERT|UPDATE|DELETE).*%s"
    metadata:
      category: security
      technology:
        - delphi
        - sql
      subcategory: [vuln]
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - SQL Injection
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# COMMAND INJECTION
# =========================================================

  - id: delphi-command-injection
    languages: [generic]
    severity: ERROR
    message: |
      Command Injection vulnerability detected.

      Examples:
      - `ShellExecute(0, 'open', 'cmd.exe', PChar('/c ' + userInput), ...)`
      - `WinExec(PChar('ping ' + userInput), ...)`

      Remediation:
      - Validate and sanitize all user input
      - Use whitelists for allowed commands
      - Avoid executing system commands when possible
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(ShellExecute|WinExec|CreateProcess|system)[[:space:]]*\\([^)]{0,150}(\\+|\\.Text|Edit|ComboBox|Param)"
    metadata:
      category: security
      technology:
        - delphi
        - windows
      subcategory: [vuln]
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Command Injection
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# WEAK ENCRYPTION
# =========================================================

  - id: delphi-weak-encryption
    languages: [generic]
    severity: WARNING
    message: |
      Weak encryption algorithm detected (DES/3DES/RC4).

      These algorithms are cryptographically broken and should not be used.

      Remediation:
      - Use AES-256 with GCM or CBC mode
      - Example: `TCipherAES.Create('AES-256-CBC')`
      - For legacy compatibility, upgrade to modern algorithms
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TDES|TripleDES|TRC4|TIdRC4|TCipherDES)\\.(Create|Encrypt|Decrypt)"
    metadata:
      category: security
      technology:
        - delphi
        - crypto
      subcategory: [vuln]
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class:
        - Cryptographic Issues
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# WEAK HASH ALGORITHM
# =========================================================

  - id: delphi-weak-hash
    languages: [generic]
    severity: WARNING
    message: |
      Weak hash algorithm detected (MD5/SHA1).

      MD5 and SHA1 are cryptographically broken for security purposes.

      Remediation:
      - Use SHA-256 or SHA-512 for hashing
      - Use bcrypt, Argon2, or PBKDF2 for password storage
      - Example: `THashSHA2.GetHashString(data)`
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(THashMD5|TIdHashMD5|TIdHashSHA1|MD5\\(|SHA1\\(|MD5Print|SHA1Digest)"
    metadata:
      category: security
      technology:
        - delphi
        - crypto
      subcategory: [vuln]
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class:
        - Cryptographic Issues
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# PROCESS INJECTION
# =========================================================

  - id: delphi-process-injection
    languages: [generic]
    severity: ERROR
    message: |
      Process injection technique detected (potential malware behavior).

      These APIs are often used in malware for code injection.

      Remediation:
      - Use only if absolutely necessary and with proper security review
      - Implement robust validation for injected code
      - Consider alternative architectures
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(VirtualAllocEx|WriteProcessMemory|CreateRemoteThread|NtCreateThreadEx)\\s*\\("
    metadata:
      category: security
      technology:
        - delphi
        - windows
      subcategory: [audit]
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      vulnerability_class:
        - Code Injection
        - Malware Behavior
      references:
        - https://attack.mitre.org/techniques/T1055/
    options:
      interfile: false

# =========================================================
# KEYLOGGING DETECTION
# =========================================================

  - id: delphi-keylogging
    languages: [generic]
    severity: ERROR
    message: |
      Keylogging capability detected.

      These APIs can capture keystrokes, which is often used in credential-stealing malware.

      Remediation:
      - Remove if not absolutely necessary
      - If legitimate use (accessibility), document clearly
      - Add user notification and consent
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)SetWindowsHookEx.*WH_KEYBOARD|GetAsyncKeyState"
    metadata:
      category: security
      technology:
        - delphi
        - windows
      subcategory: [audit]
      cwe:
        - "CWE-359: Exposure of Private Information ('Privacy Violation')"
      owasp:
        - "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class:
        - Privacy Violation
        - Malware Behavior
      references:
        - https://attack.mitre.org/techniques/T1056/001/
    options:
      interfile: false

# =========================================================
# REGISTRY PERSISTENCE
# =========================================================

  - id: delphi-registry-persistence
    languages: [generic]
    severity: WARNING
    message: |
      Registry persistence mechanism detected (Run/RunOnce keys).

      Writing to these keys causes automatic execution on system startup.

      Remediation:
      - Verify this is intentional and properly documented
      - Consider alternative startup mechanisms
      - Ensure uninstallers clean up registry entries
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i).*Run.*Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run"
    metadata:
      category: security
      technology:
        - delphi
        - windows
      subcategory: [audit]
      cwe:
        - "CWE-284: Improper Access Control"
      owasp:
        - "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class:
        - Persistence Mechanism
      references:
        - https://attack.mitre.org/techniques/T1547/001/
    options:
      interfile: false

# =========================================================
# INSECURE HTTP
# =========================================================

  - id: delphi-http-no-tls
    languages: [generic]
    severity: WARNING
    message: |
      Insecure HTTP (http://) usage detected.

      HTTP transmits data in plaintext, vulnerable to man-in-the-middle attacks.

      Remediation:
      - Use HTTPS (TLS) instead of HTTP
      - Configure proper certificate validation
      - Use `https://` URLs exclusively
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "http://[a-zA-Z0-9]"
    metadata:
      category: security
      technology:
        - delphi
        - http
      subcategory: [vuln]
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class:
        - Sensitive Data Exposure
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Protection_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# SERVER-SIDE REQUEST FORGERY (SSRF)
# =========================================================

  - id: delphi-ssrf-dynamic
    languages: [generic]
    severity: WARNING
    message: |
      Potential Server-Side Request Forgery (SSRF) via dynamic URL construction.

      When user input is used to construct URLs, attackers may force requests to internal resources.

      Remediation:
      - Validate and sanitize all URL inputs
      - Use URL whitelisting
      - Restrict network access from application servers
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*\\+"
    metadata:
      category: security
      technology:
        - delphi
        - http
      subcategory: [vuln]
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - "A10:2021 - Server-Side Request Forgery"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# EXCEPTION INFORMATION LEAK
# =========================================================

  - id: delphi-exception-leak
    languages: [generic]
    severity: WARNING
    message: |
      Exception message may leak internal information to users.

      Raw exception messages may expose:
      - File paths
      - Database structure
      - Internal IP addresses
      - Stack traces

      Remediation:
      - Log detailed errors internally
      - Show user-friendly error messages only
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Exception\\.Message|ShowMessage|MessageDlg)"
    metadata:
      category: security
      technology:
        - delphi
      subcategory: [audit]
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp:
        - "A04:2021 - Insecure Design"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class:
        - Information Exposure
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# DEBUG OUTPUT LEFTOVER
# =========================================================

  - id: delphi-debug-leftover
    languages: [generic]
    severity: INFO
    message: |
      Debug output function call detected in production code.

      Debug functions like OutputDebugString may leak information and impact performance.

      Remediation:
      - Remove debug output from production code
      - Use conditional compilation (`{$IFDEF DEBUG}`)
      - Implement proper logging framework
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(OutputDebugString|WriteLn)\\("
    metadata:
      category: security
      technology:
        - delphi
      subcategory: [audit]
      cwe:
        - "CWE-489: Active Debug Code"
      owasp:
        - "A04:2021 - Insecure Design"
      confidence: LOW
      likelihood: LOW
      impact: LOW
      vulnerability_class:
        - Active Debug Code
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
    options:
      interfile: false

# =========================================================
# PATH TRAVERSAL
# =========================================================

  - id: delphi-path-traversal
    languages: [generic]
    severity: ERROR
    message: |
      Path traversal pattern detected (`../` or `..\`).

      Attackers may use these patterns to access files outside intended directories.

      Remediation:
      - Validate and sanitize all file paths
      - Use path canonicalization (ExpandFileName, GetFullPathName)
      - Implement allowlist for allowed directories
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(\\.\\./|\\.\\.\\\\)"
    metadata:
      category: security
      technology:
        - delphi
      subcategory: [vuln]
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      vulnerability_class:
        - Path Traversal
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Path_Traversal_Cheat_Sheet.html
    options:
      interfile: false

