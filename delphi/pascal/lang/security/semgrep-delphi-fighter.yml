rules:

  # ==========================================
  # PART 1: HARDCODED CREDENTIALS 
  # ==========================================

  # Rule 1: Temel credential pattern
  - id: delphi-hardcoded-credentials
    message: |
      Hardcoded credential detected in Delphi code.
      
      Examples: password = 'secret', const API_KEY = '12345'
      
      Remediation:
      - Use environment variables (GetEnvironmentVariable)
      - Use secure secret management (Azure Key Vault, AWS Secrets Manager)
      - Never commit credentials to version control
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dpk"
        - "*.inc"
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $VAR = '$VALUE'
          - pattern: |
              $TYPE $VAR = "$VALUE"
          - pattern: |
              const $VAR = '$VALUE'
          - pattern: |
              const $VAR = "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i)(password|pass|pwd|secret|token|api.?key|auth|credential|username|user|wsUsername|wsPassword|wsSender|api_key|apikey|bearer|access_key)"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ".{2,}"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 2: Direkt assignment
  - id: delphi-direct-assignment-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded credential in direct assignment.
      
      Example: password := 'mySecret123'
      
      Remediation:
      - Use environment variables or secure configuration
    paths:
      include:
        - "*.pas"
        - "*.dpr"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|sifre|parola|secret|token|api_?key|username|user|wsUsername|wsPassword)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 3: Function parameter credential
  - id: delphi-parameter-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded credential passed as function parameter.
      
      Example: Login('admin', 'password123')
      
      Remediation:
      - Read credentials from secure sources at runtime
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Login|Connect|Authenticate|SetCredentials)[[:space:]]*\\([^,]*,[[:space:]]*['\"][^'\"]+['\"][^,)]*\\)"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 4: Hardcoded password
  - id: delphi-hardcoded-password
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded password detected. Use environment variables or secure vault.
      
      Remediation:
      - Move passwords to environment variables
      - Use Windows Credential Manager
      - Implement secure secret storage
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.inc"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|sifre|parola)[[:space:]]*[:=][[:space:]]*['\"][^'\"]{4,}['\"]"
      - pattern-not-regex: "(?i)(test|demo|example|dummy|sample)"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 5: Hardcoded username
  - id: delphi-hardcoded-username
    languages: [generic]
    severity: WARNING
    message: |
      Hardcoded username detected.
      
      Example: username := 'admin'
      
      Remediation:
      - Configure usernames externally
      - Use environment variables for configuration
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(username|user|kullanici)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_]{3,}['\"]"
      - pattern-not-regex: "(?i)(test|demo|guest|anonymous)"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [audit]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 6: API Key detection (16+ chars)
  - id: delphi-hardcoded-api-key
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded API key / token detected.
      
      Example: api_key := 'sk-abc123xyz789'
      
      Remediation:
      - Store API keys in environment variables
      - Use secret management services
      - Rotate keys regularly
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(api[_-]?key|secret|token|bearer|access[_-]?key|client[_-]?secret)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_\\-]{16,}['\"]"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 7: API Key (8+ chars - daha geniş)
  - id: delphi-api-key-token
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded API key or token (shorter length).
      
      Remediation: Use environment variables for all secrets.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(api[_-]?key|apikey|token|bearer|access_token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_\\-]{8,}['\"]"
    metadata:
      category: security
      technology: [delphi, pascal]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html

  # Rule 8: JWT token
  - id: delphi-jwt-hardcoded
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded JWT token detected.
      
      JWT tokens contain encoded authentication claims and should never be hardcoded.
      
      Remediation:
      - Generate JWT tokens dynamically
      - Use short expiration times
      - Implement token refresh
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "eyJ[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}"
    metadata:
      category: security
      technology: [delphi, jwt]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html

  # ==========================================
  # PART 2: CONNECTION STRINGS & DATABASE
  # ==========================================

  # Rule 9: Connection string credential
  - id: delphi-connection-string-creds
    languages: [generic]
    severity: ERROR
    message: |
      Database connection string contains plaintext credentials.
      
      Example: 'User ID=sa;Password=admin123'
      
      Remediation:
      - Use Integrated Security / Windows Authentication
      - Store connection strings in encrypted config files
      - Use environment variables for credentials
    paths:
      include:
        - "*.pas"
        - "*.dfm"
        - "*.inc"
    patterns:
      - pattern-regex: "(?i)(connectionstring|datasource|server|database|TADOConnection|TFDConnection|TOraSession).{0,150}(password|pwd|user id|uid|username)[[:space:]]*=[[:space:]]*[^;\\r\\n]+"
    metadata:
      category: security
      technology: [delphi, database, sql]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Database_Security_Cheat_Sheet.html

  # Rule 10: Credentials in connection string (basit)
  - id: delphi-connection-string-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Credentials found in connection string.
      
      Remediation: Remove plaintext credentials from connection strings.
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(User ID|UID|Password|PWD)[[:space:]]*=[[:space:]]*[^;]+"
    metadata:
      category: security
      technology: [delphi, database]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Database_Security_Cheat_Sheet.html

  # Rule 11: Persist Security Info
  - id: delphi-persist-security-info
    languages: [generic]
    severity: WARNING
    message: |
      Persist Security Info=True may expose credentials in memory.
      
      When set to True, sensitive information remains in memory longer than necessary.
      
      Remediation: Set Persist Security Info=False
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)Persist[[:space:]]+Security[[:space:]]+Info[[:space:]]*=[[:space:]]*True"
    metadata:
      category: security
      technology: [delphi, database]
      subcategory: [audit]
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class: [Sensitive Data Exposure]
      references:
        - https://docs.microsoft.com/en-us/dotnet/api/system.data.sqlclient.sqlconnection.persistsecurityinfo

  # Rule 12: Oracle credentials
  - id: delphi-oracle-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded Oracle database credentials.
      
      Remediation:
      - Use Oracle Wallet for secure credential storage
      - Use external authentication (LDAP, Active Directory)
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TOraSession|OracleSession|OracleConnection).{0,50}(Username|Password|User)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, oracle]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]
      references:
        - https://docs.oracle.com/en/database/oracle/oracle-database/19/dbseg/part_6.html

  # ==========================================
  # PART 3: MESSAGE QUEUE & WEB SERVICE
  # ==========================================

  # Rule 13: Message queue credentials
  - id: delphi-message-queue-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded message queue credentials (TIBCO/MQ/RabbitMQ/ActiveMQ).
      
      Remediation: Use environment variables or secret management.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(tibco|mq|rabbitmq|activemq|ibmmq).{0,50}(password|pass|pwd|username|user)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, mq, tibco]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # Rule 14: Web service credentials
  - id: delphi-webservice-credentials
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded SOAP/Web Service credentials.
      
      Remediation: Use certificate-based authentication or OAuth.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(soap|wsdl|webservice|ws_|THTTPRIO).{0,50}(username|user|password|pass|auth)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, soap, webservice]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # ==========================================
  # PART 4: NETWORK PROTOCOLS (FTP/SMTP)
  # ==========================================

  # Rule 15: FTP credentials
  - id: delphi-ftp-credentials
    languages: [generic]
    severity: ERROR
    message: |
      FTP credentials hardcoded. FTP transmits credentials in plaintext by default.
      
      Remediation:
      - Use SFTP or FTPS instead of plain FTP
      - Use environment variables for credentials
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TIdFTP|TftpClient|FTP).{0,50}(username|user|password|pass)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, ftp]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # Rule 16: SMTP credentials
  - id: delphi-smtp-credentials
    languages: [generic]
    severity: ERROR
    message: |
      SMTP/Email credentials hardcoded.
      
      Remediation:
      - Use environment variables for mail credentials
      - Implement OAuth2 for email authentication
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TIdSMTP|TIdMessage|SMTP|Mail).{0,50}(username|user|password|pass)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, smtp, email]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # ==========================================
  # PART 5: URL & HEADER EXPOSURE
  # ==========================================

  # Rule 17: URL credential exposure
  - id: delphi-url-credential-exposure
    languages: [generic]
    severity: ERROR
    message: |
      Credential or token exposed inside URL query string.
      
      Example: ?password=secret&token=abc123
      
      Remediation:
      - Use HTTP Authorization headers
      - Use POST requests for sensitive data
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|token|apikey|secret|sifre|auth|accountid)=([A-Za-z0-9_\\-%]{4,})"
    metadata:
      category: security
      technology: [delphi, http]
      subcategory: [vuln]
      cwe: "CWE-598: Information Exposure Through Query Strings"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Sensitive Data Exposure]

  # Rule 18: Hardcoded auth header
  - id: delphi-hardcoded-auth-header
    languages: [generic]
    severity: ERROR
    message: |
      Hardcoded Authorization header or Bearer token.
      
      Remediation: Generate tokens dynamically at runtime.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Authorization|Bearer|Basic)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9\\-_\\.:=/+]{12,}['\"]"
    metadata:
      category: security
      technology: [delphi, http, rest]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # ==========================================
  # PART 6: CONFIG & ENCODED SECRETS
  # ==========================================

  # Rule 19: Config secret detection
  - id: delphi-config-secret
    languages: [generic]
    severity: ERROR
    message: |
      Plaintext credential detected in configuration structure (INI/XML/CONF).
      
      Remediation:
      - Use encrypted configuration sections
      - Store sensitive values in environment variables
    paths:
      include:
        - "*.pas"
        - "*.dfm"
        - "*.ini"
        - "*.xml"
        - "*.conf"
    patterns:
      - pattern-regex: "(?i)(password|pwd|secret|token|apikey|client_secret)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_@#\\-$%^&*!]{4,}"
      - pattern-not-regex: "(?i)(test|demo|example|sample|dummy)"
    metadata:
      category: security
      technology: [delphi, config]
      subcategory: [vuln]
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Sensitive Data Exposure]

  # Rule 20: Base64 secret (long)
  - id: delphi-base64-secret
    languages: [generic]
    severity: WARNING
    message: |
      Possible Base64 encoded credential detected.
      
      Base64 is encoding, not encryption. It can be easily reversed.
      
      Remediation: Use proper encryption for sensitive data.
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|secret|token|apikey|credential|auth).{0,40}['\"][A-Za-z0-9+/]{24,}={0,2}['\"]"
    metadata:
      category: security
      technology: [delphi]
      subcategory: [audit]
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class: [Sensitive Data Exposure]

  # Rule 21: Base64 credential (short)
  - id: delphi-base64-credential
    languages: [generic]
    severity: WARNING
    message: |
      Possible Base64 encoded credential (shorter length).
      
      Remediation: Use proper encryption, not Base64 encoding.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(password|secret|key|token|cred)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/]{16,}['\"]"
    metadata:
      category: security
      technology: [delphi]
      subcategory: [audit]
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class: [Sensitive Data Exposure]

  # ==========================================
  # PART 7: CLOUD & CERTIFICATES
  # ==========================================

  # Rule 22: Cloud access keys
  - id: delphi-cloud-access-key
    languages: [generic]
    severity: ERROR
    message: |
      Cloud access key detected in source code!
      
      AWS Key (AKIA...), Google API (AIza...), GitHub Token (ghp_...)
      
      Remediation:
      - Remove immediately and rotate the key
      - Use IAM roles or service accounts
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-either:
          - pattern-regex: "AKIA[0-9A-Z]{16}"
          - pattern-regex: "AIza[0-9A-Za-z\\-_]{35}"
          - pattern-regex: "ghp_[A-Za-z0-9]{30,}"
    metadata:
      category: security
      technology: [aws, google, github, cloud]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      vulnerability_class: [Hard-coded Secrets, Cloud Misconfiguration]

  # Rule 23: Private key exposure (specific)
  - id: delphi-private-key-exposed
    languages: [generic]
    severity: ERROR
    message: |
      Private key hardcoded in source code! This is a CRITICAL security issue.
      
      Remediation:
      - Remove the private key immediately
      - Revoke and rotate the exposed key
      - Use HSM or key management services
    paths:
      include:
        - "*.pas"
        - "*.pem"
        - "*.key"
        - "*.crt"
    patterns:
      - pattern-regex: "-----BEGIN (RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY-----"
    metadata:
      category: security
      technology: [crypto, ssl, tls]
      subcategory: [vuln]
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      vulnerability_class: [Cryptographic Issues]

  # Rule 24: Private key (general)
  - id: delphi-private-key
    languages: [generic]
    severity: ERROR
    message: |
      Private key hardcoded.
      
      Remediation: Remove immediately and rotate the key.
    paths:
      include:
        - "*.pas"
        - "*.pem"
    patterns:
      - pattern-regex: "-----BEGIN.*PRIVATE KEY-----"
    metadata:
      category: security
      technology: [crypto]
      subcategory: [vuln]
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: CRITICAL
      vulnerability_class: [Cryptographic Issues]

  # Rule 25: Certificate exposure
  - id: delphi-certificate-exposed
    languages: [generic]
    severity: WARNING
    message: |
      Embedded certificate detected in source code.
      
      For public CA certificates, this may be acceptable.
      For private certificates, move to secure storage.
    paths:
      include:
        - "*.pas"
        - "*.crt"
        - "*.pem"
    patterns:
      - pattern-regex: "-----BEGIN CERTIFICATE-----"
    metadata:
      category: security
      technology: [crypto, ssl]
      subcategory: [audit]
      cwe: "CWE-321: Use of Hard-coded Cryptographic Key"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      vulnerability_class: [Cryptographic Issues]

  # ==========================================
  # PART 8: INJECTIONS
  # ==========================================

  # Rule 26: SQL injection via concatenation
  - id: delphi-sql-injection-concat
    languages: [generic]
    severity: ERROR
    message: |
      SQL Injection vulnerability via string concatenation.
      
      Example: 'SELECT * FROM users WHERE id = ' + Edit1.Text
      
      Remediation:
      - ALWAYS use parameterized queries
      - Example: WHERE id = :id, then Params.ParamByName('id').Value := Edit1.Text
    paths:
      include:
        - "*.pas"
        - "*.dpr"
    patterns:
      - pattern-regex: "(?i)(SELECT|INSERT|UPDATE|DELETE).{0,100}(\\+|\\|\\|).{0,100}(Text|Edit|EditValue|FieldByName|ParamByName)"
    metadata:
      category: security
      technology: [delphi, sql]
      subcategory: [vuln]
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [SQL Injection]

  # Rule 27: SQL injection via Format()
  - id: delphi-sql-format-injection
    languages: [generic]
    severity: ERROR
    message: |
      SQL Injection risk: Format() function used with user input.
      
      Example: Format('SELECT * FROM users WHERE id = %s', [Edit1.Text])
      
      Remediation: Use parameterized queries instead of Format().
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)Format[[:space:]]*\\([[:space:]]*['\"].*(SELECT|INSERT|UPDATE|DELETE).*%s"
    metadata:
      category: security
      technology: [delphi, sql]
      subcategory: [vuln]
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [SQL Injection]

  # Rule 28: Command injection
  - id: delphi-command-injection
    languages: [generic]
    severity: ERROR
    message: |
      Command Injection vulnerability.
      
      Example: ShellExecute(0, 'open', 'cmd.exe', PChar('/c ' + userInput), ...)
      
      Remediation:
      - Validate and sanitize all user input
      - Use whitelists for allowed commands
      - Avoid system command execution when possible
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(ShellExecute|WinExec|CreateProcess)[[:space:]]*\\([^)]{0,100}(\\+|\\.Text|Edit|ComboBox)"
    metadata:
      category: security
      technology: [delphi, windows]
      subcategory: [vuln]
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Command Injection]

  # ==========================================
  # PART 9: WEAK CRYPTO
  # ==========================================

  # Rule 29: Weak encryption
  - id: delphi-weak-encryption-usage
    languages: [generic]
    severity: WARNING
    message: |
      Weak encryption algorithm detected (DES/3DES/RC4).
      
      These algorithms are cryptographically broken.
      
      Remediation: Use AES-256 with GCM or CBC mode.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TDES|TripleDES|TCipherDES|TIdRC4|TRC4)\\.(Create|Encrypt|Decrypt)\\("
    metadata:
      category: security
      technology: [delphi, crypto]
      subcategory: [vuln]
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class: [Cryptographic Issues]

  # Rule 30: Weak hash
  - id: delphi-weak-hash-usage
    languages: [generic]
    severity: WARNING
    message: |
      Weak hash algorithm detected (MD5/SHA1).
      
      MD5 and SHA1 are cryptographically broken for security purposes.
      
      Remediation: Use SHA-256, SHA-512, bcrypt, or Argon2.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(THashMD5|TIdHashMD5|TIdHashSHA1|MD5Print|SHA1Digest)\\("
    metadata:
      category: security
      technology: [delphi, crypto]
      subcategory: [vuln]
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class: [Cryptographic Issues]

  # ==========================================
  # PART 10: PROCESS & MALWARE
  # ==========================================

  # Rule 31: Process injection
  - id: delphi-process-injection
    languages: [generic]
    severity: ERROR
    message: |
      Process injection technique detected (potential malware behavior).
      
      These APIs are commonly used in malware for code injection.
      
      Remediation: Review if this is necessary. Consider alternative architectures.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(VirtualAllocEx|WriteProcessMemory|CreateRemoteThread|NtCreateThreadEx)[[:space:]]*\\("
    metadata:
      category: security
      technology: [delphi, windows]
      subcategory: [audit]
      cwe: "CWE-94: Code Injection"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      confidence: HIGH
      likelihood: LOW
      impact: HIGH
      vulnerability_class: [Code Injection, Malware Behavior]

  # Rule 32: Keylogging
  - id: delphi-keylogging
    languages: [generic]
    severity: ERROR
    message: |
      Keylogging capability detected.
      
      These APIs can capture keystrokes (credential-stealing malware behavior).
      
      Remediation: Remove if not absolutely necessary. If legitimate (accessibility), document clearly.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)SetWindowsHookEx[[:space:]]*\\([^)]*WH_KEYBOARD"
    metadata:
      category: security
      technology: [delphi, windows]
      subcategory: [audit]
      cwe: "CWE-359: Privacy Violation"
      owasp: "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class: [Privacy Violation]

  # Rule 33: Registry persistence
  - id: delphi-registry-persistence
    languages: [generic]
    severity: WARNING
    message: |
      Registry persistence mechanism detected (Run/RunOnce keys).
      
      Writing to these keys causes automatic execution on system startup.
      
      Remediation: Verify this is intentional and properly documented.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Run|RunOnce).{0,100}Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run"
    metadata:
      category: security
      technology: [delphi, windows]
      subcategory: [audit]
      cwe: "CWE-284: Improper Access Control"
      owasp: "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class: [Persistence Mechanism]

  # ==========================================
  # PART 11: NETWORK & SSRF
  # ==========================================

  # Rule 34: HTTP insecure dynamic
  - id: delphi-http-insecure-dynamic
    languages: [generic]
    severity: WARNING
    message: |
      Insecure HTTP request or dynamic URL (potential SSRF).
      
      Remediation:
      - Use HTTPS instead of HTTP
      - Validate and sanitize URL inputs
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*http://"
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*\\+"
    metadata:
      category: security
      technology: [delphi, http]
      subcategory: [vuln]
      cwe: "CWE-319: Cleartext Transmission"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Sensitive Data Exposure]

  # Rule 35: HTTP no TLS
  - id: delphi-http-no-tls
    languages: [generic]
    severity: WARNING
    message: |
      Insecure HTTP (http://) usage.
      
      HTTP transmits data in plaintext, vulnerable to MITM attacks.
      
      Remediation: Use HTTPS (TLS) instead.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "http://[a-zA-Z0-9]"
    metadata:
      category: security
      technology: [delphi, http]
      subcategory: [vuln]
      cwe: "CWE-319: Cleartext Transmission"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Sensitive Data Exposure]

  # Rule 36: SSRF dynamic
  - id: delphi-ssrf-dynamic
    languages: [generic]
    severity: WARNING
    message: |
      Potential Server-Side Request Forgery (SSRF) via dynamic URL construction.
      
      User-controlled URLs may allow attackers to access internal resources.
      
      Remediation: Validate and whitelist URL inputs.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*\\+"
    metadata:
      category: security
      technology: [delphi, http]
      subcategory: [vuln]
      cwe: "CWE-918: Server-Side Request Forgery"
      owasp: "A10:2021 - Server-Side Request Forgery"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      vulnerability_class: [Server-Side Request Forgery (SSRF)]

  # ==========================================
  # PART 12: INFO DISCLOSURE & DEBUG
  # ==========================================

  # Rule 37: Exception info leak
  - id: delphi-exception-info-leak
    languages: [generic]
    severity: WARNING
    message: |
      Exception.Message may leak internal information to users.
      
      Raw exceptions can expose file paths, database structure, or internal IPs.
      
      Remediation: Log detailed errors internally, show user-friendly messages only.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Exception\\.Message|ShowMessage|MessageDlg)"
    metadata:
      category: security
      technology: [delphi]
      subcategory: [audit]
      cwe: "CWE-209: Information Exposure Through Error Messages"
      owasp: "A04:2021 - Insecure Design"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class: [Information Exposure]

  # Rule 38: Debug leftover
  - id: delphi-debug-leftover
    languages: [generic]
    severity: INFO
    message: |
      Debug output function call in production code.
      
      Debug functions may leak information and impact performance.
      
      Remediation: Remove debug output from production code.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(OutputDebugString|WriteLn)\\("
    metadata:
      category: best-practice
      technology: [delphi]
      subcategory: [audit]
      cwe: "CWE-489: Active Debug Code"
      owasp: "A04:2021 - Insecure Design"
      confidence: LOW
      likelihood: LOW
      impact: LOW
      vulnerability_class: [Active Debug Code]

  # ==========================================
  # PART 13: FILE OPERATIONS & DANGEROUS APIS
  # ==========================================

  # Rule 39: Path traversal
  - id: delphi-path-traversal
    languages: [generic]
    severity: ERROR
    message: |
      Path traversal pattern detected (../ or ..\\)
      
      Attackers use these patterns to access files outside intended directories.
      
      Remediation:
      - Validate and sanitize file paths
      - Use path canonicalization (ExpandFileName)
      - Implement allowlist for allowed directories
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(\\.\\./|\\.\\.\\\\)"
    metadata:
      category: security
      technology: [delphi]
      subcategory: [vuln]
      cwe: "CWE-22: Path Traversal"
      owasp: "A01:2021 - Broken Access Control"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Path Traversal]

  # Rule 40: Dangerous API
  - id: delphi-dangerous-api
    languages: [generic]
    severity: WARNING
    message: |
      Potentially dangerous API call.
      
      These APIs can be abused for malicious purposes.
      
      Remediation: Review if this API is necessary. Consider safer alternatives.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(CreateOleObject|URLDownloadToFile|BlockInput|keybd_event|mouse_event)\\("
    metadata:
      category: security
      technology: [delphi, windows]
      subcategory: [audit]
      cwe: "CWE-694: Use of Multiple Resources with Duplicate Identifier"
      owasp: "A04:2021 - Insecure Design"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class: [Dangerous Method or Function]

  # ==========================================
  # PART 14: DFM FILES
  # ==========================================

  # Rule 41: DFM password
  - id: delphi-dfm-password
    languages: [generic]
    severity: ERROR
    message: |
      Password found inside DFM form file.
      
      DFM files are stored in plaintext; passwords are easily extracted.
      
      Remediation: NEVER store passwords in DFM files. Set password programmatically at runtime.
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(Password|Pass|Pwd)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, dfm]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # Rule 42: DFM connection string
  - id: delphi-dfm-connection
    languages: [generic]
    severity: WARNING
    message: |
      Connection string detected inside DFM file.
      
      Connection strings in DFM may expose database credentials.
      
      Remediation: Move connection string configuration to code or encrypted config files.
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)ConnectionString[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      category: security
      technology: [delphi, dfm]
      subcategory: [vuln]
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      vulnerability_class: [Hard-coded Secrets]

  # Rule 43: File deletion
  - id: delphi-delete-file
    languages: [generic]
    severity: WARNING
    message: |
      File deletion operation detected.
      
      Unauthorized file deletion can cause data loss or denial of service.
      
      Remediation: Validate file paths, implement access controls, and audit deletion operations.
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(DeleteFile|TFile\\.Delete|RemoveDir)\\("
    metadata:
      category: security
      technology: [delphi]
      subcategory: [audit]
      cwe: "CWE-284: Improper Access Control"
      owasp: "A01:2021 - Broken Access Control"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      vulnerability_class: [Improper Access Control]