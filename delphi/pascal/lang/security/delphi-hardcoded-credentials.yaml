# ==============================================
# SEMGREP DELPHI Pascal - Hamit CİBO - https://www.linkedin.com/in/ciboh/
# ==============================================
# Objective:
# - Maximum Delphi/Pascal security coverage
# - Minimum false positives
# - Secret + Injection + Malware + Weak Crypto + InfoLeak
#
# Supported Files:
# .pas .dpr .dpk .inc .dfm .ini .xml .conf .pem .key .crt
#
# Category:
# - Hardcoded Credentials
# - SQL Injection
# - Command Injection
# - Weak Crypto
# - Malware Techniques
# - Info Disclosure
# - Dangerous APIs
# - Network Security
#
# Version: v1.0
# ==============================================

rules:

# =========================================================
# HARDCODED CREDENTIALS
# =========================================================

  - id: delphi-hardcoded-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded credential detected."
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dpk"
        - "*.inc"
        - "*.dfm"
    patterns:
      - pattern-either:
          - pattern: |
              $TYPE $VAR = '$VALUE'
          - pattern: |
              $TYPE $VAR = "$VALUE"
          - pattern: |
              const $VAR = '$VALUE'
          - pattern: |
              const $VAR = "$VALUE"
          - pattern: |
              $VAR := '$VALUE'
          - pattern: |
              $VAR := "$VALUE"
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i)(password|passwd|pass|pwd|secret|token|api.?key|apikey|access.?key|client.?secret|auth|credential|username|user|uid|wsUsername|wsPassword|wsSender|bearer|authorization|sifre|parola)"
      - metavariable-regex:
          metavariable: $VALUE
          regex: ".{2,}"
      - pattern-not-regex: "(?i)(test|demo|dummy|sample|example|guest|anonymous)"
    metadata:
      confidence: HIGH
      category: security
      cwe: "CWE-798"

# =========================================================
# DIRECT PASSWORD ASSIGNMENT
# =========================================================

  - id: delphi-direct-password-assignment
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded password assignment detected."
    paths:
      include:
        - "*.pas"
        - "*.dpr"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|sifre|parola|secret|token|api_?key|username|user)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
      - pattern-not-regex: "(?i)(test|demo|dummy|sample|example)"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

# =========================================================
# CONNECTION STRING CREDENTIALS
# =========================================================

  - id: delphi-connection-string-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Plaintext credentials detected inside connection string."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
        - "*.inc"
    patterns:
      - pattern-regex: "(?i)(ConnectionString|TADOConnection|TFDConnection|TOraSession|OracleConnection|datasource|server|database).{0,200}(password|pwd|user id|uid|username)[[:space:]]*=[[:space:]]*[^;\\r\\n]+"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

# =========================================================
# PERSIST SECURITY INFO
# =========================================================

  - id: delphi-persist-security-info
    languages: [generic]
    severity: WARNING
    message: "⚠️ Persist Security Info=True may expose credentials in memory."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)Persist[[:space:]]+Security[[:space:]]+Info[[:space:]]*=[[:space:]]*True"
    metadata:
      confidence: HIGH
      cwe: "CWE-312"

# =========================================================
# URL CREDENTIAL EXPOSURE
# =========================================================

  - id: delphi-url-credential-exposure
    languages: [generic]
    severity: ERROR
    message: "🚨 Credential/token exposed inside URL."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|passwd|pwd|token|apikey|secret|auth|accountid|sifre)=([A-Za-z0-9_\\-%]{3,})"
    metadata:
      confidence: HIGH
      cwe: "CWE-598"

# =========================================================
# AUTH HEADER
# =========================================================

  - id: delphi-hardcoded-auth-header
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded Authorization/Bearer token detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(Authorization|Bearer|Basic)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9\\-_\\.:=/+]{8,}['\"]"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

# =========================================================
# CONFIG SECRET
# =========================================================

  - id: delphi-config-secret
    languages: [generic]
    severity: ERROR
    message: "🚨 Plaintext credential detected in config structure."
    paths:
      include:
        - "*.ini"
        - "*.xml"
        - "*.conf"
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|pwd|secret|token|apikey|client_secret|access_key)[[:space:]]*[:=][[:space:]]*['\"]?[A-Za-z0-9_@#\\-$%^&*!]{3,}"
      - pattern-not-regex: "(?i)(test|demo|dummy|sample|example)"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

# =========================================================
# BASE64 SECRET
# =========================================================

  - id: delphi-base64-secret
    languages: [generic]
    severity: WARNING
    message: "⚠️ Possible Base64 encoded credential detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(password|secret|token|apikey|credential|auth).{0,40}['\"][A-Za-z0-9+/]{16,}={0,2}['\"]"
    metadata:
      confidence: MEDIUM

# =========================================================
# JWT TOKEN
# =========================================================

  - id: delphi-jwt-token
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded JWT token detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-regex: "eyJ[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}\\.[A-Za-z0-9_\\-]{8,}"
    metadata:
      confidence: HIGH

# =========================================================
# CLOUD ACCESS KEY
# =========================================================

  - id: delphi-cloud-access-key
    languages: [generic]
    severity: ERROR
    message: "🚨 Cloud access key detected."
    paths:
      include:
        - "*.pas"
        - "*.dfm"
    patterns:
      - pattern-either:
          - pattern-regex: "AKIA[0-9A-Z]{16}"
          - pattern-regex: "AIza[0-9A-Za-z\\-_]{35}"
          - pattern-regex: "ghp_[A-Za-z0-9]{30,}"
    metadata:
      confidence: HIGH
      cwe: "CWE-798"

# =========================================================
# SMTP CREDENTIALS
# =========================================================

  - id: delphi-smtp-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 SMTP credentials hardcoded."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TIdSMTP|SMTP|Mail).{0,60}(username|user|password|pass)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

# =========================================================
# FTP CREDENTIALS
# =========================================================

  - id: delphi-ftp-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 FTP credentials hardcoded."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TIdFTP|FTP|TftpClient).{0,60}(username|user|password|pass)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

# =========================================================
# MQ / TIBCO
# =========================================================

  - id: delphi-message-queue-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded MQ/TIBCO credentials."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(tibco|mq|rabbitmq|activemq|ibmmq).{0,60}(password|pass|pwd|username|user)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

# =========================================================
# SOAP / WEBSERVICE
# =========================================================

  - id: delphi-webservice-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded SOAP/WebService credentials."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(soap|wsdl|webservice|ws_|THTTPRIO).{0,60}(username|user|password|pass|auth)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

# =========================================================
# ORACLE CREDENTIALS
# =========================================================

  - id: delphi-oracle-credentials
    languages: [generic]
    severity: ERROR
    message: "🚨 Hardcoded Oracle credentials."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TOraSession|OracleSession|OracleConnection).{0,60}(Username|Password|User)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

# =========================================================
# SQL INJECTION
# =========================================================

  - id: delphi-sql-injection-concat
    languages: [generic]
    severity: ERROR
    message: "🚨 SQL Injection risk via string concatenation."
    paths:
      include:
        - "*.pas"
        - "*.dpr"
    patterns:
      - pattern-regex: "(?i)(SELECT|INSERT|UPDATE|DELETE).*(\\+|\\|\\|).*(Text|Edit|EditValue|FieldByName|ParamByName|QuotedStr)"
    metadata:
      confidence: HIGH
      cwe: "CWE-89"

# =========================================================
# FORMAT SQL
# =========================================================

  - id: delphi-sql-format-injection
    languages: [generic]
    severity: ERROR
    message: "🚨 SQL Injection risk via Format() function."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)Format\\s*\\(\\s*['\"].*(SELECT|INSERT|UPDATE|DELETE).*%s"
    metadata:
      confidence: HIGH
      cwe: "CWE-89"

# =========================================================
# COMMAND INJECTION
# =========================================================

  - id: delphi-command-injection
    languages: [generic]
    severity: ERROR
    message: "🚨 Potential command injection."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(ShellExecute|WinExec|CreateProcess|system)[[:space:]]*\\([^)]{0,150}(\\+|\\.Text|Edit|ComboBox|Param)"
    metadata:
      confidence: HIGH
      cwe: "CWE-78"

# =========================================================
# WEAK ENCRYPTION
# =========================================================

  - id: delphi-weak-encryption
    languages: [generic]
    severity: WARNING
    message: "⚠️ Weak encryption algorithm detected (DES/3DES/RC4)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(TDES|TripleDES|TRC4|TIdRC4|TCipherDES)\\.(Create|Encrypt|Decrypt)"
    metadata:
      confidence: HIGH
      cwe: "CWE-327"

# =========================================================
# WEAK HASH
# =========================================================

  - id: delphi-weak-hash
    languages: [generic]
    severity: WARNING
    message: "⚠️ Weak hash algorithm detected (MD5/SHA1)."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(THashMD5|TIdHashMD5|TIdHashSHA1|MD5\\(|SHA1\\(|MD5Print|SHA1Digest)"
    metadata:
      confidence: HIGH
      cwe: "CWE-327"

# =========================================================
# PROCESS INJECTION
# =========================================================

  - id: delphi-process-injection
    languages: [generic]
    severity: ERROR
    message: "🚨 Process injection technique detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(VirtualAllocEx|WriteProcessMemory|CreateRemoteThread|NtCreateThreadEx)\\s*\\("
    metadata:
      confidence: HIGH

# =========================================================
# KEYLOGGING
# =========================================================

  - id: delphi-keylogging
    languages: [generic]
    severity: ERROR
    message: "🚨 Keylogging capability detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)SetWindowsHookEx.*WH_KEYBOARD|GetAsyncKeyState"
    metadata:
      confidence: HIGH

# =========================================================
# REGISTRY PERSISTENCE
# =========================================================

  - id: delphi-registry-persistence
    languages: [generic]
    severity: WARNING
    message: "⚠️ Registry persistence detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i).*Run.*Software\\\\Microsoft\\\\Windows\\\\CurrentVersion\\\\Run"
    metadata:
      confidence: HIGH

# =========================================================
# HTTP NO TLS
# =========================================================

  - id: delphi-http-no-tls
    languages: [generic]
    severity: WARNING
    message: "⚠️ Insecure HTTP usage detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "http://[a-zA-Z0-9]"
    metadata:
      confidence: HIGH
      cwe: "CWE-319"

# =========================================================
# SSRF
# =========================================================

  - id: delphi-ssrf-dynamic
    languages: [generic]
    severity: WARNING
    message: "⚠️ Potential SSRF via dynamic URL."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(IdHTTP|TNetHTTPClient)\\.(Get|Post)[[:space:]]*\\([^)]*\\+"
    metadata:
      confidence: MEDIUM

# =========================================================
# EXCEPTION LEAK
# =========================================================

  - id: delphi-exception-leak
    languages: [generic]
    severity: WARNING
    message: "⚠️ Exception message may leak internal details."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(Exception\\.Message|ShowMessage|MessageDlg)"
    metadata:
      confidence: MEDIUM
      cwe: "CWE-209"

# =========================================================
# DEBUG OUTPUT
# =========================================================

  - id: delphi-debug-leftover
    languages: [generic]
    severity: INFO
    message: "ℹ️ Debug output detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(OutputDebugString|WriteLn)\\("
    metadata:
      confidence: LOW

# =========================================================
# PATH TRAVERSAL
# =========================================================

  - id: delphi-path-traversal
    languages: [generic]
    severity: ERROR
    message: "🚨 Path traversal pattern detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(\\.\\./|\\.\\.\\\\)"
    metadata:
      confidence: HIGH
      cwe: "CWE-22"

# =========================================================
# FILE DELETE
# =========================================================

  - id: delphi-delete-file
    languages: [generic]
    severity: WARNING
    message: "⚠️ File deletion operation detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(DeleteFile|TFile\\.Delete|RemoveDir)\\("
    metadata:
      confidence: HIGH

# =========================================================
# DANGEROUS API
# =========================================================

  - id: delphi-dangerous-api
    languages: [generic]
    severity: WARNING
    message: "⚠️ Dangerous API usage detected."
    paths:
      include:
        - "*.pas"
    patterns:
      - pattern-regex: "(?i)(CreateOleObject|URLDownloadToFile|BlockInput|keybd_event|mouse_event)\\("
    metadata:
      confidence: HIGH

# =========================================================
# PRIVATE KEY
# =========================================================

  - id: delphi-private-key
    languages: [generic]
    severity: ERROR
    message: "🚨 Private key detected."
    paths:
      include:
        - "*.pas"
        - "*.pem"
        - "*.key"
    patterns:
      - pattern-regex: "-----BEGIN (RSA|DSA|EC|OPENSSH|PGP)? ?PRIVATE KEY-----"
    metadata:
      confidence: HIGH
      cwe: "CWE-321"

# =========================================================
# CERTIFICATE
# =========================================================

  - id: delphi-certificate
    languages: [generic]
    severity: WARNING
    message: "⚠️ Embedded certificate detected."
    paths:
      include:
        - "*.crt"
        - "*.pem"
        - "*.pas"
    patterns:
      - pattern-regex: "-----BEGIN CERTIFICATE-----"
    metadata:
      confidence: MEDIUM

# =========================================================
# DFM PASSWORD
# =========================================================

  - id: delphi-dfm-password
    languages: [generic]
    severity: ERROR
    message: "🚨 Password found inside DFM file."
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)(Password|Pass|Pwd)[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: HIGH

# =========================================================
# DFM CONNECTION STRING
# =========================================================

  - id: delphi-dfm-connection
    languages: [generic]
    severity: WARNING
    message: "⚠️ Connection string detected inside DFM."
    paths:
      include:
        - "*.dfm"
    patterns:
      - pattern-regex: "(?i)ConnectionString[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]"
    metadata:
      confidence: MEDIUM
