rules:
- id: unguarded-autogen-history-append
  patterns:
  - pattern: $HISTORY.append($MSG)
  - metavariable-regex:
      metavariable: $HISTORY
      regex: .*(chat_history|messages|conversation|history).*
  - pattern-not-inside: |
      guard.write(...)
      ...
  message: >-
    Unguarded append to agent conversation history '$HISTORY'. In multi-agent systems (AutoGen, CrewAI)
    messages from other agents or tools can carry injection payloads that persist in the history and affect
    later turns (memory poisoning, OWASP Agentic Top 10 ASI06; MITRE ATLAS AML.T0080.000). Validate and
    screen content before it is persisted to agent memory (source class, embedded instructions, sensitive
    data) and verify the integrity of protected keys on read. An open-source reference implementation
    is OWASP Agent Memory Guard.
  languages:
  - python
  severity: WARNING
  metadata:
    category: security
    subcategory:
    - audit
    cwe:
    - 'CWE-501: Trust Boundary Violation'
    - 'CWE-1427: Improper Neutralization of Input Used for LLM Prompting'
    technology:
    - python
    - ai
    - llm
    - agents
    - autogen
    - crewai
    confidence: LOW
    likelihood: MEDIUM
    impact: HIGH
    references:
    - https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    - https://atlas.mitre.org/techniques/AML.T0080.000
    - https://github.com/OWASP/www-project-agent-memory-guard
    license: Commons Clause License Condition v1.0[LGPL-2.1-only]
