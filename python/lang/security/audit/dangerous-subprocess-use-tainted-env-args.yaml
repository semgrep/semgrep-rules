rules:
- id: dangerous-subprocess-use-tainted-env-args
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sanitizers:
    - pattern: shlex.quote(...)
  pattern-sources:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern: os.environ
          - pattern: os.environ.get('$FOO', ...)
          - pattern: os.environb
          - pattern: os.environb.get('$FOO', ...)
          - pattern: os.getenv('$ANYTHING', ...)
          - pattern: os.getenvb('$ANYTHING', ...)
      - patterns:
        - pattern-either:
          - patterns:
            - pattern-either:
              - pattern: sys.argv
              - pattern: sys.orig_argv
          - patterns:
            - pattern-inside: |
                $PARSER = argparse.ArgumentParser(...)
                ...
            - pattern-inside: |
                $ARGS = $PARSER.parse_args()
            - pattern: <... $ARGS ...>
          - patterns:
            - pattern-inside: |
                $PARSER = optparse.OptionParser(...)
                ...
            - pattern-inside: |
                $ARGS = $PARSER.parse_args()
            - pattern: <... $ARGS ...>
          - patterns:
            - pattern-either:
              - pattern-inside: |
                  $OPTS, $ARGS = getopt.getopt(...)
                  ...
              - pattern-inside: |
                  $OPTS, $ARGS = getopt.gnu_getopt(...)
                  ...
            - pattern-either:
              - patterns:
                - pattern-inside: |
                    for $O, $A in $OPTS:
                      ...
                - pattern: $A
              - pattern: $ARGS
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-not: subprocess.$FUNC("...", ...)
        - pattern-not: subprocess.$FUNC(["...",...], ...)
        - pattern-not: subprocess.$FUNC(("...",...), ...)
        - pattern-not: subprocess.CalledProcessError(...)
        - pattern-not: subprocess.SubprocessError(...)
        - pattern: subprocess.$FUNC($CMD, ...)
      - patterns:
        - pattern-not: subprocess.$FUNC(args="...", ...)
        - pattern-not: subprocess.$FUNC(args=["...",...], ...)
        - pattern-not: subprocess.$FUNC(args=("...",...), ...)
        - pattern: subprocess.$FUNC(args=$CMD, ...)
      - patterns:
        - pattern-not: subprocess.$FUNC("=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...)
        - pattern: subprocess.$FUNC("=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...)
      - patterns:
        - pattern-not: subprocess.$FUNC(["=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(("=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...), ...)
        - pattern-not: subprocess.$FUNC(["=~/^(.*\\/)?env$/", ..., "=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(("=~/^(.*\\/)?env$/", ..., "=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...), ...)
        - pattern-either:
          - pattern: subprocess.$FUNC(["=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(("=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...), ...)
          - pattern: subprocess.$FUNC(["=~/^(.*\\/)?env$/", ..., "=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(("=~/^(.*\\/)?env$/", ..., "=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...), ...)
      - patterns:
        - pattern-not: subprocess.$FUNC(["...", "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...], ..., executable="=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ...)
        - pattern-not: subprocess.$FUNC(("...", "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...), ..., executable="=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ...)
        - pattern-either:
          - pattern: subprocess.$FUNC([..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...], ..., executable="=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ...)
          - pattern: subprocess.$FUNC((..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...), ..., executable="=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ...)
      - patterns:
        - pattern-not: subprocess.$FUNC("=~/^(.*\\/)?python[0-9.]*$/","...",...)
        - pattern: subprocess.$FUNC("=~/^(.*\\/)?python[0-9.]*$/", $CMD)
      - patterns:
        - pattern-not: subprocess.$FUNC(["=~/^(.*\\/)?python[0-9.]*$/","...",...],...)
        - pattern-not: subprocess.$FUNC(("=~/^(.*\\/)?python[0-9.]*$/","...",...),...)
        - pattern-either:
          - pattern: subprocess.$FUNC(["=~/^(.*\\/)?python[0-9.]*$/", $CMD],...)
          - pattern: subprocess.$FUNC(("=~/^(.*\\/)?python[0-9.]*$/", $CMD),...)
      - patterns:
        - pattern-not: subprocess.$FUNC("=~/^(.*\\/)?python[0-9.]*$/", "-c", "...", ...)
        - pattern-not: subprocess.$FUNC("=~/^(.*\\/)?node$/", "-e", "...", ...)
        - pattern-not: subprocess.$FUNC("=~/^(.*\\/)?perl[0-9.]*$/", "-e", "...", ...)
        - pattern-either:
          - pattern: subprocess.$FUNC("=~/^(.*\\/)?python[0-9.]*$/", "-c", $CMD, ...)
          - pattern: subprocess.$FUNC("=~/^(.*\\/)?node$/", "-e", $CMD, ...)
          - pattern: subprocess.$FUNC("=~/^(.*\\/)?perl[0-9.]*$/", "-e", $CMD, ...)
      - patterns:
        - pattern-not: subprocess.$FUNC(["=~/^(.*\\/)?python[0-9.]*$/", "-c", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(("=~/^(.*\\/)?python[0-9.]*$/", "-c", "...", ...), ...)
        - pattern-not: subprocess.$FUNC(["=~/^(.*\\/)?node$/", "-e", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(("=~/^(.*\\/)?node$/", "-e", "...", ...), ...)
        - pattern-not: subprocess.$FUNC(["=~/^(.*\\/)?perl[0-9.]*$/", "-e", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(("=~/^(.*\\/)?perl[0-9.]*$/", "-e", "...", ...), ...)
        - pattern-either:
          - pattern: subprocess.$FUNC(["=~/^(.*\\/)?python[0-9.]*$/", "-c", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(("=~/^(.*\\/)?python[0-9.]*$/", "-c", $CMD, ...), ...)
          - pattern: subprocess.$FUNC(["=~/^(.*\\/)?node$/", "-e", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(("=~/^(.*\\/)?node$/", "-e", $CMD, ...), ...)
          - pattern: subprocess.$FUNC(["=~/^(.*\\/)?perl[0-9.]*$/", "-e", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(("=~/^(.*\\/)?perl[0-9.]*$/", "-e", $CMD, ...), ...)
      - patterns:
        - pattern-not: subprocess.$FUNC(args=["=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(args=("=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...), ...)
        - pattern-not: subprocess.$FUNC(args=["=~/^(.*\\/)?env$/", ..., "=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(args=["=~/^(.*\\/)?python[0-9.]*$/", "-c", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(args=["=~/^(.*\\/)?node$/", "-e", "...", ...], ...)
        - pattern-not: subprocess.$FUNC(args=["=~/^(.*\\/)?perl[0-9.]*$/", "-e", "...", ...], ...)
        - pattern-either:
          - pattern: subprocess.$FUNC(args=["=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(args=("=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...), ...)
          - pattern: subprocess.$FUNC(args=["=~/^(.*\\/)?env$/", ..., "=~/^(.*\\/)?(sh|bash|ksh|csh|tcsh|zsh)$/", ..., "=~/^-[a-zA-Z]*c[a-zA-Z]*$/", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(args=["=~/^(.*\\/)?python[0-9.]*$/", "-c", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(args=["=~/^(.*\\/)?node$/", "-e", $CMD, ...], ...)
          - pattern: subprocess.$FUNC(args=["=~/^(.*\\/)?perl[0-9.]*$/", "-e", $CMD, ...], ...)
    - focus-metavariable: $CMD
  message: >-
    Detected subprocess function '$FUNC' with user controlled data. A malicious actor
    could leverage this to perform command injection.
    You may consider using 'shlex.quote()'.
  metadata:
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    cwe:
    - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
    asvs:
      section: 'V5: Validation, Sanitization and Encoding Verification Requirements'
      control_id: 5.3.8 OS Command Injection
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v53-output-encoding-and-injection-prevention-requirements
      version: '4'
    references:
    - https://stackoverflow.com/questions/3172470/actual-meaning-of-shell-true-in-subprocess
    - https://docs.python.org/3/library/subprocess.html
    - https://docs.python.org/3/library/shlex.html
    - https://semgrep.dev/docs/cheat-sheets/python-command-injection/
    category: security
    technology:
    - python
    confidence: MEDIUM
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
  languages: [python]
  severity: ERROR
