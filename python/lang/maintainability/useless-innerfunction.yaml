rules:
  - id: useless-inner-function
    patterns:
      - pattern-not-inside: |
          def $F(...):
              ...
              def $FF(...):
                 ...
              ...
              <... $FF ...>
      # A reference inside the context expression of an `as`-bound `with`
      # statement is not found by the deep expression operator above, so it
      # is matched explicitly here (issue #4059).
      - pattern-not-inside: |
          def $F(...):
              ...
              def $FF(...):
                 ...
              ...
              with <... $FF ...> as $CM:
                  ...
      - pattern-not-inside: |
          def $F(...):
              ...
              class $CLAZZ(...):
                ...
      - pattern-inside: |
          def $F(...):
            ...
            def $FF(...):
               ...
            ...
      - pattern: |
          def $FF(...):
            ...
      - pattern-not: |
          @$DECORATOR
          def $FF(...):
            ...
    message: function `$FF` is defined inside a function but never used
    languages:
      - python
    severity: ERROR
    metadata:
      category: maintainability
      technology:
        - python
