rules:
  - id: wildcard-cors
    languages:
      - python
    message: CORS policy allows any origin using a wildcard or broad origin regex.
      Prefer an explicit allowlist of trusted origins.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: '[..., "*", ...]'
          - pattern: '"=~/^\\.\\*$/"'
          - pattern: '"=~/^\\.\\+$/"'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  $APP.add_middleware(
                    CORSMiddleware,
                    allow_origins=$ORIGIN,
                    ...)
              - pattern: |
                  $APP.add_middleware(
                    CORSMiddleware,
                    allow_origin_regex=$ORIGIN,
                    ...)
              - pattern: |
                  Middleware(
                    CORSMiddleware,
                    allow_origins=$ORIGIN,
                    ...)
              - pattern: |
                  Middleware(
                    CORSMiddleware,
                    allow_origin_regex=$ORIGIN,
                    ...)
              - pattern: |
                  CORSMiddleware(
                    $APP,
                    allow_origins=$ORIGIN,
                    ...)
              - pattern: |
                  CORSMiddleware(
                    $APP,
                    allow_origin_regex=$ORIGIN,
                    ...)
              - pattern: |
                  CORSMiddleware(
                    app=$APP,
                    allow_origins=$ORIGIN,
                    ...)
              - pattern: |
                  CORSMiddleware(
                    app=$APP,
                    allow_origin_regex=$ORIGIN,
                    ...)
          - focus-metavariable: $ORIGIN
    severity: WARNING
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      category: security
      technology:
        - python
        - fastapi
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration
        - https://cwe.mitre.org/data/definitions/942.html
        - https://fastapi.tiangolo.com/tutorial/cors/
        - https://www.starlette.io/middleware/#corsmiddleware
      likelihood: HIGH
      impact: LOW
      confidence: MEDIUM
      vulnerability_class:
        - Configuration
      subcategory:
        - vuln
