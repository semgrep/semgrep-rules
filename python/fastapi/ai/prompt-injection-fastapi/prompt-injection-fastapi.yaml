rules:
- id: prompt-injection-fastapi
  message: A prompt is created and user-controlled data reaches that prompt. This
    can lead to prompt injection. Make sure the user inputs are properly segmented
    from the system's in your prompts.
  severity: INFO
  metadata:
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-75: Failure to Sanitize Special Elements into a Different Plane (Special
      Element Injection)'
    display-name: Special Element Injection with FastAPI
    functional-categories:
    - ai::sink::prompt::huggingface
    - ai::sink::prompt::langchain
    - ai::sink::prompt::openai
    - web::source::cookie::fastapi
    - web::source::form-data::fastapi
    - web::source::header::fastapi
    - web::source::http-body::fastapi
    - web::source::url-path-params::fastapi
    - web::source::url-query-string::fastapi
    owasp:
    - A03:2021 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    technology:
    - ai
    - fastapi
    - huggingface
    - langchain
    - openai
    - web
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Other
  languages:
  - python
  mode: taint
  options:
    interfile: true
    symbolic_propagation: true
    taint_assume_safe_booleans: true
    taint_assume_safe_numbers: true
  pattern-sources:
  - patterns:
    - pattern: |
        @$APP.$ROUTE("$ROUTESTRING", ...)
        async def $FUNC(..., $PARAM, ...):
          ...
    - metavariable-type:
        metavariable: $APP
        types:
        - fastapi.FastAPI
        - fastapi.APIRouter
    - metavariable-comparison:
        comparison: str($PARAM) not in $ROUTESTRING
    - metavariable-regex:
        metavariable: $ROUTE
        regex: ^(websocket|get|put|post|delete|options|head|patch|trace)$
    - focus-metavariable: $PARAM
  - label: FASTAPI_REQUEST
    patterns:
    - patterns:
      - pattern-either:
        - patterns:
          - pattern: |
              @$APP.middleware(...)
              async def $FUNC($FASTAPI_REQUEST, ...):
                ...
          - metavariable-type:
              metavariable: $APP
              types:
              - fastapi.FastAPI
              - fastapi.APIRouter
        - patterns:
          - pattern: |
              def $FUNC(..., $FASTAPI_REQUEST, ...):
                ...
          - metavariable-type:
              metavariable: $FASTAPI_REQUEST
              types:
              - fastapi.Request
              - fastapi.requests.Request
              - starlette.requests.Request
      - focus-metavariable: $FASTAPI_REQUEST
  - label: __SOURCE__
    patterns:
    - patterns:
      - pattern-either:
        - pattern: $FASTAPI_REQUEST.url.path
        - pattern: $FASTAPI_REQUEST.base_url
        - pattern: $FASTAPI_REQUEST.headers
        - pattern: $FASTAPI_REQUEST.query_params
        - pattern: $FASTAPI_REQUEST.cookies
        - pattern: $FASTAPI_REQUEST.stream()
        - pattern: $FASTAPI_REQUEST.read(...)
        - pattern: $FASTAPI_REQUEST.form(...)
        - pattern: $FASTAPI_REQUEST._get_form(...)
        - pattern: $FASTAPI_REQUEST.body()
        - pattern: $FASTAPI_REQUEST.json()
    requires: FASTAPI_REQUEST
  - patterns:
    - pattern-either:
      - patterns:
        - pattern: |
            @$APP.$ROUTE("$ROUTESTRING")
            async def $FUNC(..., $PARAM, ...):
              ...
        - metavariable-type:
            metavariable: $APP
            types:
            - fastapi.FastAPI
            - fastapi.APIRouter
        - metavariable-comparison:
            comparison: str($PARAM) in $ROUTESTRING
        - metavariable-regex:
            metavariable: $ROUTE
            regex: ^(websocket|get|put|post|delete|options|head|patch|trace)$
        - metavariable-type:
            metavariable: $PARAM
            types:
            - str | None
            - str
            - Optional[str]
            - Union[str, None]
            - list[str] | None
            - list[str]
            - Optional[List[str]]
            - Union[list[str], None]
        - focus-metavariable: $PARAM
  - label: FASTAPI_REQUEST
    patterns:
    - patterns:
      - pattern-either:
        - patterns:
          - pattern: |
              @$APP.middleware(...)
              async def $FUNC($FASTAPI_REQUEST, ...):
                ...
          - metavariable-type:
              metavariable: $APP
              types:
              - fastapi.FastAPI
              - fastapi.APIRouter
        - patterns:
          - pattern: |
              def $FUNC(..., $FASTAPI_REQUEST, ...):
                ...
          - metavariable-type:
              metavariable: $FASTAPI_REQUEST
              types:
              - fastapi.Request
              - fastapi.requests.Request
              - starlette.requests.Request
      - focus-metavariable: $FASTAPI_REQUEST
  - label: __SOURCE__
    patterns:
    - patterns:
      - pattern-either:
        - pattern: $FASTAPI_REQUEST.path_params
    requires: FASTAPI_REQUEST
  pattern-propagators:
  - from: $DEFAULT
    patterns:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $DICT[$KEY]
            ...
        - pattern-inside: |
            $DICT.get($KEY, $DEFAULT)
            ...
        - pattern-inside: |
            $DICT = { ... }
            ...
        - pattern-inside: |
            $DICT = dict(...)
            ...
      - pattern-either:
        - pattern: $DICT.get($FIELD, $DEFAULT)
        - pattern: $DICT.setdefault($KEY, $DEFAULT)
    to: $DICT
  - from: $FROM_DICT
    patterns:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $TO_DICT[$KEY]
            ...
        - pattern-inside: |
            $TO_DICT.get($KEY, $DEFAULT)
            ...
        - pattern-inside: |
            $TO_DICT = { ... }
            ...
        - pattern-inside: |
            $TO_DICT = dict(...)
            ...
        - pattern-inside: |
            $FROM_DICT[$KEY]
            ...
        - pattern-inside: |
            $FROM_DICT.get($KEY, $DEFAULT)
            ...
        - pattern-inside: |
            $FROM_DICT = { ... }
            ...
        - pattern-inside: |
            $FROM_DICT = dict(...)
            ...
      - pattern-either:
        - pattern: $TO_DICT.update($FROM_DICT)
        - pattern: $TO_DICT | $FROM_DICT
        - pattern: $TO_DICT |= $FROM_DICT
    to: $TO_DICT
  - from: $FROM
    patterns:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $LIST = [ ... ]
            ...
        - pattern-inside: |
            $LIST = list(...)
            ...
      - pattern-either:
        - pattern: $LIST.append($FROM)
        - pattern: $LIST.extend($FROM)
        - pattern: $LIST.insert($INDEX, $FROM)
    to: $LIST
  - from: $FROM
    patterns:
    - patterns:
      - pattern-either:
        - pattern: $FROM.$LOG($SINK, ...)
        - pattern: $FROM.$LOG(..., msg=$SINK, ...)
        - pattern: $APP.logger.$LOG($SINK, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: ^(info|warning|error|critical|log|exception|handle)$
    to: $SINK
  - from: $FROM
    patterns:
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $SET = { $ITEM, ... }
            ...
        - pattern-inside: |
            $SET = set(...)
            ...
        - pattern-inside: |
            $OTHERSET = { $ITEM, ... }
            ...
        - pattern-inside: |
            $OTHERSET = set(...)
            ...
      - pattern-either:
        - pattern: $SET.update(..., $FROM, ...)
        - pattern: $SET.intersection_update(..., $FROM, ...)
        - pattern: $SET.difference_update(..., $FROM, ...)
        - pattern: $SET.symmetric_difference_update(..., $FROM, ...)
        - pattern: $SET.add($FROM)
        - pattern: $SET |= $FROM
        - pattern: $SET &= $FROM
        - pattern: $SET -= $FROM
        - pattern: $SET ^= $FROM
    to: $SET
  - from: $FORM
    patterns:
    - pattern: $FORM.populate_obj($OBJ)
    to: $OBJ
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: openai.OpenAI(...).chat.completions.create(..., messages=$SINK, ...)
      - pattern: openai.OpenAI(...).beta.assistants.create(..., instructions=$SINK,
          ...)
      - pattern: openai.OpenAI(...).beta.assistants.create(..., tools=$SINK, ...)
      - pattern: openai.OpenAI(...).beta.threads.create(..., messages=$SINK, ...)
      - pattern: openai.OpenAI(...).beta.threads.runs.create(..., instructions=$SINK,
          ...)
      - pattern: openai.OpenAI(...).beta.threads.runs.create(..., additional_instructions=$SINK,
          ...)
      - pattern: openai.OpenAI(...).beta.threads.messages.create(..., content=$SINK,
          ...)
      - pattern: openai.OpenAI(...).beta.threads.messages.create(..., file_ids=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).chat.completions.create(..., messages=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.assistants.create(..., instructions=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.assistants.create(..., tools=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.threads.create(..., messages=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.threads.runs.create(..., instructions=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.threads.runs.create(..., additional_instructions=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.threads.messages.create(..., content=$SINK,
          ...)
      - pattern: openai.AsyncOpenAI(...).beta.threads.messages.create(..., file_ids=$SINK,
          ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-either:
      - pattern: huggingface_hub.InferenceApi(...)(..., inputs=$SINK, ...)
      - pattern: huggingface_hub.inference_api.InferenceApi(...)(..., inputs=$SINK,
          ...)
      - pattern: huggingface_hub.InferenceClient(...).conversational($SINK, ...)
      - pattern: huggingface_hub.InferenceClient(...).conversational(..., text=$SINK,
          ...)
      - pattern: huggingface_hub.InferenceClient(...).text_generation($SINK, ...)
      - pattern: huggingface_hub.InferenceClient(...).text_generation(..., prompt=$SINK,
          ...)
    - focus-metavariable: $SINK
  - patterns:
    - pattern-either:
      - pattern: langchain.prompts.PromptTemplate.from_template(..., template=$SINK,
          ...)
      - pattern: langchain.prompts.PromptTemplate.from_template(...).format(..., $SINK,
          ...)
      - pattern: langchain.prompts.HumanMessagePromptTemplate.from_template(..., template=$SINK,
          ...)
      - pattern: langchain.prompts.HumanMessagePromptTemplate.from_template(...).format(...,
          $SINK, ...)
      - pattern: langchain.prompts.FewShotPromptTemplate.from_template(..., template=$SINK,
          ...)
      - pattern: langchain.prompts.FewShotPromptTemplate.from_template(...).format(...,
          $SINK, ...)
      - pattern: langchain_core.prompts.ChatPromptTemplate.from_messages(..., messages=$SINK,
          ...)
      - pattern: langchain_core.prompts.ChatPromptTemplate.from_messages(...).format_messages(...,
          $SINK, ...)
      - pattern: langchain_core.messages.HumanMessage($SINK, ...)
      - pattern: langchain_core.messages.HumanMessage(..., content=$SINK, ...)
      - pattern: langchain_core.messages.AIMessage($SINK, ...)
      - pattern: langchain_core.messages.AIMessage(..., content=$SINK, ...)
      - pattern: langchain.memory.ChatMessageHistory(...).add_user_message($SINK,
          ...)
      - pattern: langchain.memory.ChatMessageHistory(...).add_ai_message($SINK, ...)
    - focus-metavariable: $SINK
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: int(...)
      - pattern: bool(...)
      - pattern: float(...)
      - pattern: complex(...)
      - pattern: oct(...)
      - pattern: hex(...)
      - pattern: bin(...)
      - pattern: round(...)
      - pattern: id(...)
      - pattern: hash(...)
      - pattern: len(...)
      - pattern: type(...)
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $DICT[$KEY]
          ...
      - pattern-inside: |
          $DICT = { $KEY: $VALUE for ... in ...}
          ...
      - pattern-inside: |
          $DICT.get($KEY, $DEFAULT)
          ...
      - pattern-inside: |
          $DICT = { }
          ...
      - pattern-inside: |
          $DICT = { $KEY: $VALUE, ... }
          ...
      - pattern-inside: |
          $DICT = dict(...)
          ...
    - pattern-either:
      - pattern: $DICT.clear()
      - pattern: $DICT.len()
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $LIST = [ ... ]
          ...
      - pattern-inside: |
          $LIST = list(...)
          ...
    - pattern-either:
      - pattern: $LIST.clear()
      - pattern: $LIST.count(...)
      - pattern: $LIST.index(...)
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $SET = { $ITEM, ... }
          ...
      - pattern-inside: |
          $SET = set(...)
          ...
    - pattern-either:
      - pattern: $SET.len()
      - pattern: $SET.clear()
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $SET = { $ITEM, ... }
          ...
      - pattern-inside: |
          $SET = { $ITEM for ... in ...}
          ...
      - pattern-inside: |
          $SET = set(...)
          ...
      - pattern-inside: |
          $SET = frozenset(...)
          ...
      - pattern-inside: |
          $OTHERSET = { $ITEM, ... }
          ...
      - pattern-inside: |
          $OTHERSET = set(...)
          ...
    - pattern-either:
      - pattern: $SET.isdisjoint($OTHERSET)
      - pattern: $SET.difference($OTHERSET)
      - pattern: $SET.issubset($OTHERSET)
      - pattern: $SET < $OTHERSET
      - pattern: $SET <= $OTHERSET
      - pattern: $SET.issuperset($OTHERSET)
      - pattern: $SET > $OTHERSET
      - pattern: $SET >= $OTHERSET
  - patterns:
    - pattern-either:
      - pattern-inside: |
          $TUPLE = ( $ITEM, ... )
          ...
      - pattern-inside: |
          $TUPLE = $ITEM, ...
          ...
      - pattern-inside: |
          $TUPLE = tuple(...)
          ...
    - pattern-either:
      - pattern: $TUPLE.len()
  - pattern: django.shortcuts.get_object_or_404(...)
  - pattern: django.shortcuts.get_list_or_404(...)
