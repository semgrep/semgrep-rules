rules:
- id: unverified-jwt-decode
  patterns:
    - pattern-either:
        - patterns:
          - pattern: |
              jwt.$DECODE(..., options={..., "verify_signature": $BOOL, ...}, ...)
          - metavariable-pattern:
              metavariable: $BOOL
              pattern: |
                False
          - focus-metavariable: $BOOL
        - patterns:
            - pattern: |
                $OPTS = {..., "verify_signature": $BOOL, ...}
                ...
                jwt.$DECODE(..., options=$OPTS, ...)
            - metavariable-pattern:
                metavariable: $BOOL
                pattern: |
                  False
            - focus-metavariable: $BOOL
    - metavariable-regex:
        metavariable: $DECODE
        regex: ^(decode|decode_complete)$
  message: >-
    Detected JWT token decoded with 'verify_signature=False'. This bypasses any integrity
    checks for the token which means the token could be tampered with by
    malicious actors. Ensure that the JWT token is verified.
  metadata:
    owasp:
    - A02:2017 - Broken Authentication
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    cwe:
    - 'CWE-287: Improper Authentication'
    references:
    - https://pyjwt.readthedocs.io/en/stable/api.html#jwt.decode_complete
    - https://github.com/we45/Vulnerable-Flask-App/blob/752ee16087c0bfb79073f68802d907569a1f0df7/app/app.py#L96
    category: security
    technology:
    - jwt
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
  fix: |
    True
  severity: ERROR
  languages:
  - python
