rules:
- id: file-inclusion-copy
  message: Detected non-constant file inclusion. This can lead to local file inclusion
    (LFI) or remote file inclusion (RFI) if user input reaches this statement.
  languages:
  - php
  severity: ERROR
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_COOKIE
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: if (in_array($input, [...])) { include("..." . $input . ".php");
          }
  pattern-sinks:
  - patterns:
    - pattern-inside: $FUNC(...);
    - pattern: $VAR
    - metavariable-regex:
        metavariable: $FUNC
        regex: \b(include|include_once|require|require_once)\b
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program
      (''PHP Remote File Inclusion'')'
    confidence: HIGH
    likelihood: HIGH
    impact: MEDIUM
    technology:
    - php
    references:
    - https://example.com
