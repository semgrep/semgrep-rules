rules:
  - id: lloydcoder-hardcoded-paystack-secret-key
    message: >-
      Hardcoded Paystack secret key detected. Store the credential in a secret manager
      or environment variable and rotate it if it was committed.
    languages: [generic]
    severity: ERROR
    pattern-regex: |
      (?i)\bsk_(?:live|test)_[A-Za-z0-9]{40}\b
    metadata:
      category: security
      subcategory: vuln
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology: [secrets, fintech]
      references:
        - https://github.com/LloydCoder
      tags: [security, secrets, nigeria, paystack]

  - id: lloydcoder-hardcoded-flutterwave-secret-key
    message: >-
      Hardcoded Flutterwave secret key detected. Store it in a secret manager or
      environment variable and rotate it if it was committed.
    languages: [generic]
    severity: ERROR
    pattern-regex: |
      (?i)\bFLWSECK(?:_TEST|_LIVE)?-[A-Za-z0-9]{32}-X\b
    metadata:
      category: security
      subcategory: vuln
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology: [secrets, fintech]
      references:
        - https://github.com/LloydCoder
      tags: [security, secrets, nigeria, flutterwave, rave]

  - id: lloydcoder-hardcoded-remita-credentials
    message: >-
      Possible Remita merchant identifier or API hash is hardcoded. Verify the value,
      remove it from source control, and rotate exposed credentials.
    languages: [generic]
    severity: WARNING
    pattern-regex: |
      (?i)\bremita[_-]?(?:api[_-]?)?(?:key|hash|secret)\s*[:=]\s*["']?([A-Za-z0-9]{40,128})\b
    metadata:
      category: security
      subcategory: vuln
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology: [secrets, fintech]
      references:
        - https://github.com/LloydCoder
      tags: [security, secrets, nigeria, remita]

  - id: lloydcoder-hardcoded-interswitch-mac-key
    message: >-
      Hardcoded Interswitch Webpay MAC key detected. Store it outside source code
      and rotate it if it was committed.
    languages: [generic]
    severity: ERROR
    pattern-regex: |
      (?i)\bmacKey["']?\s*[:=]\s*["']?[0-9A-F]{64}["']?
    metadata:
      category: security
      subcategory: vuln
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology: [secrets, fintech]
      references:
        - https://github.com/LloydCoder
      tags: [security, secrets, nigeria, interswitch, webpay]

  - id: lloydcoder-hardcoded-sportybet-betking-jwt
    message: >-
      Possible hardcoded JWT used by a betting platform detected. Confirm that it is
      a credential, then remove and rotate it if exposed.
    languages: [generic]
    severity: WARNING
    pattern-regex: |
      (?i)\b(?:sportybet|betking)[^\r\n]{0,40}(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})\b
    metadata:
      category: security
      subcategory: vuln
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      cwe: "CWE-798: Use of Hard-coded Credentials"
      technology: [secrets, fintech]
      references:
        - https://github.com/LloydCoder
      tags: [security, secrets, nigeria, sportybet, betking, jwt]
