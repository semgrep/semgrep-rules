rules:
- id: aws-insecure-api-gateway-tls-version
  patterns:
  - pattern-either:
    - pattern: |
        resource "aws_api_gateway_domain_name" $ANYTHING {
            ...
            security_policy = "..."
            ...
        }
    - pattern: |
        resource "aws_apigatewayv2_domain_name" $ANYTHING {
            ...
            domain_name_configuration {...}
            ...
        }
  - pattern-not:
      patterns:
      - pattern: |
          resource "aws_api_gateway_domain_name" $ANYTHING {
              ...
              security_policy = $POLICY
              ...
          }
      - metavariable-regex:
          metavariable: $POLICY
          regex: ^['\"](TLS_1_2|SecurityPolicy_TLS1[23]_[A-Z0-9_]+)['\"]$
  - pattern-not: |
      resource "aws_apigatewayv2_domain_name" $ANYTHING {
              ...
              domain_name_configuration {
                  ...
                  security_policy = "TLS_1_2"
                  ...
              }
          }
  message: Detected AWS API Gateway to be using an insecure version of TLS. To fix this issue make sure
    to set "security_policy" equal to "TLS_1_2". For "aws_api_gateway_domain_name" you can also use an
    enhanced security policy that starts with "SecurityPolicy_TLS12" or "SecurityPolicy_TLS13", such as
    "SecurityPolicy_TLS13_1_3_2025_09" or the post-quantum "SecurityPolicy_TLS13_1_2_PQ_2025_09".
  languages:
  - terraform
  severity: WARNING
  metadata:
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    category: security
    technology:
    - aws
    - terraform
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-security-policies-list.html
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
