rules:
- id: aws-s3-bucket-versioning-not-enabled
  patterns:
  # Keep bucket-name bindings consistent for quoted and unquoted HCL labels.
  # Separate versioning must reference this bucket in the same file.
  - pattern-either:
    - patterns:
      - pattern: |
          resource "aws_s3_bucket" "$BUCKET" {
            ...
          }
      - pattern-not-inside: |
          resource "aws_s3_bucket" "$BUCKET" {
            ...
          }
          ...
          resource "aws_s3_bucket_versioning" $VERSIONING {
            ...
            bucket = aws_s3_bucket.$BUCKET.id
            ...
            versioning_configuration {
              ...
              status = "Enabled"
              ...
            }
            ...
          }
      - pattern-not-inside: |
          resource "aws_s3_bucket_versioning" $VERSIONING {
            ...
            bucket = aws_s3_bucket.$BUCKET.id
            ...
            versioning_configuration {
              ...
              status = "Enabled"
              ...
            }
            ...
          }
          ...
          resource "aws_s3_bucket" "$BUCKET" {
            ...
          }
    - patterns:
      - pattern: |
          resource "aws_s3_bucket" $BUCKET {
            ...
          }
      - pattern-not: |
          resource "aws_s3_bucket" "..." {
            ...
          }
      - pattern-not-inside: |
          resource "aws_s3_bucket" $BUCKET {
            ...
          }
          ...
          resource "aws_s3_bucket_versioning" $VERSIONING {
            ...
            bucket = aws_s3_bucket.$BUCKET.id
            ...
            versioning_configuration {
              ...
              status = "Enabled"
              ...
            }
            ...
          }
      - pattern-not-inside: |
          resource "aws_s3_bucket_versioning" $VERSIONING {
            ...
            bucket = aws_s3_bucket.$BUCKET.id
            ...
            versioning_configuration {
              ...
              status = "Enabled"
              ...
            }
            ...
          }
          ...
          resource "aws_s3_bucket" $BUCKET {
            ...
          }
  - pattern-not-inside: |
      resource "aws_s3_bucket" $ANYTHING {
        ...
        versioning {
          ...
          enabled = true
          ...
        }
        ...
      }
    # filter out unknowns for now
  - pattern-not-inside: |
      resource "aws_s3_bucket" $ANYTHING {
        ...
        versioning {
          ...
          enabled = var.$X
          ...
        }
        ...
      }
  message: >-
    Ensure that Amazon S3 bucket versioning is not enabled. Consider using versioning if you don't have alternative backup mechanism.
  metadata:
    category: best-practice
    technology:
    - terraform
    - aws
  languages: [hcl]
  severity: WARNING