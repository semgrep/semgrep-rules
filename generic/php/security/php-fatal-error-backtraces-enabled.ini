[PHP]
; Include a backtrace in fatal error messages
; Default Value: On
# ruleid: php-fatal-error-backtraces-enabled
;fatal_error_backtraces = On

# ruleid: php-fatal-error-backtraces-enabled
fatal_error_backtraces = On

# ruleid: php-fatal-error-backtraces-enabled
fatal_error_backtraces=1

# ok: php-fatal-error-backtraces-enabled
fatal_error_backtraces = 0

# ok: php-fatal-error-backtraces-enabled
fatal_error_backtraces = Off

# ok: php-fatal-error-backtraces-enabled
display_errors = On

[www]
# ruleid: php-fatal-error-backtraces-enabled
php_admin_flag[fatal_error_backtraces] = on

# ok: php-fatal-error-backtraces-enabled
php_admin_value[fatal_error_backtraces] = 0
