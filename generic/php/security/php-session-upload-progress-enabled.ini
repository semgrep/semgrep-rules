[Session]
; Enable upload progress tracking in $_SESSION
; Default Value: On
; Development Value: On
; Production Value: On
; https://php.net/session.upload-progress.enabled
# ruleid: php-session-upload-progress-enabled
;session.upload_progress.enabled = On

# ruleid: php-session-upload-progress-enabled
session.upload_progress.enabled = On

# ruleid: php-session-upload-progress-enabled
session.upload_progress.enabled=1

# ruleid: php-session-upload-progress-enabled
session.upload_progress.enabled = "true"

# ok: php-session-upload-progress-enabled
session.upload_progress.enabled = Off

# ok: php-session-upload-progress-enabled
session.upload_progress.enabled = 0

# ok: php-session-upload-progress-enabled
;session.upload_progress.enabled = Off

# ok: php-session-upload-progress-enabled
session.upload_progress.cleanup = On

[www]
# ruleid: php-session-upload-progress-enabled
php_admin_value[session.upload_progress.enabled] = 1

# ruleid: php-session-upload-progress-enabled
php_flag[session.upload_progress.enabled] = on

# ok: php-session-upload-progress-enabled
php_admin_value[session.upload_progress.enabled] = 0
