rules:
- id: detected-composio-api-key
  patterns:
  - pattern-regex: (?<![A-Za-z0-9_-])(?:ak_[A-Za-z0-9_-]{20}|oak_[A-Za-z0-9_-]{20}|uak_[A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])
  languages: [regex]
  paths:
    exclude:
      - "*.svg"
      - "*go.sum"
      - "*package.json"
      - "*package-lock.json"
      - "*bundle.js"
      - "*pnpm-lock*"
      - "*Podfile.lock"
      - "*cargo.lock"
  message: >-
    Composio API key detected. This is a sensitive credential and should not be hardcoded here.
    Revoke it with POST https://backend.composio.dev/api/v3.1/api_key_revocation, mint a new key in
    the Composio dashboard, and read it from an environment variable or a secrets manager.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    category: security
    technology:
    - secrets
    - composio
    confidence: HIGH
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://docs.composio.dev/reference/api-reference/api-keys/postApiKeyRevocation
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
