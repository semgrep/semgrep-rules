rules:
  - id: ps-amsi-bypass-memory-patch
    message: >-
      Memory-patching AMSI bypass pattern detected (T1562.001 / T1055).
      Combining VirtualProtect, WriteProcessMemory, or AllocHGlobal with
      Add-Type or DllImport is the structural pattern for directly patching
      amsi.dll functions in process memory, rendering AMSI non-functional.
      This P/Invoke approach is used in advanced bypasses to avoid the
      reflection-based technique that is more widely detected.
    severity: ERROR
    languages:
      - powershell
    metadata:
      category: security
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - "A03:2021 - Injection"
        - "A03:2025 - Injection"
      references:
        - https://attack.mitre.org/techniques/T1562/001/
        - https://www.r-tec.net/r-tec-blog-bypass-amsi-in-2025.html
      technology:
        - powershell
      cwe2021-top25: true
      cwe2022-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: HIGH
    pattern-regex: '(?i)(VirtualProtect|WriteProcessMemory|AllocHGlobal)(.{0,500})(Add-Type|DllImport|amsi)'
