rules:
  - id: ps-lsass-process-targeting
    message: >-
      LSASS process targeting detected (T1003.001). Either Get-Process lsass
      (process enumeration prior to memory reading) or the PROCESS_ALL_ACCESS
      constant 0x1F0FFF in a P/Invoke context indicates preparation for LSASS
      memory dumping. This is the primary technique for in-memory credential
      extraction without writing a dump file to disk, used in Invoke-Mimikatz
      and custom credential dumping tools.
    severity: ERROR
    languages:
      - powershell
    metadata:
      category: security
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
        - "A07:2025 - Identification and Authentication Failures"
      references:
        - https://attack.mitre.org/techniques/T1003/001/
      technology:
        - powershell
      cwe2021-top25: true
      cwe2022-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-either:
      - pattern: Get-Process lsass
      - pattern-regex: '(?i)(0x1[Ff]0[Ff]{3}|OpenProcess.{0,200}lsass)'
