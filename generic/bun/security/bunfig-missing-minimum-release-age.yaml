rules:
  - id: bunfig-missing-minimum-release-age
    patterns:
      - pattern-regex: (?ms)(^[\[a-zA-Z].*)
      - pattern-not-regex: minimumReleaseAge
    message: |
      This bunfig.toml does not set a minimum release age. Newly published
      packages can be malicious or unstable. Add `minimumReleaseAge = 604800`
      (seconds) under the `[install]` section to wait 7 days before installing
      newly published package versions.

      Example:

      ```toml
      [install]
      minimumReleaseAge = 604800
      ```

      Reference: https://bun.sh/docs/runtime/bunfig#install-minimumreleaseage
    languages:
      - generic
    severity: WARNING
    paths:
      include:
        - "**/bunfig.toml"
    metadata:
      category: security
      technology:
        - bun
        - nodejs
      cwe:
        - "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
      confidence: LOW
      likelihood: LOW
      impact: MEDIUM
      subcategory:
        - audit
      vulnerability_class:
        - Insecure Configuration
      references:
        - https://bun.sh/docs/runtime/bunfig#install-minimumreleaseage
