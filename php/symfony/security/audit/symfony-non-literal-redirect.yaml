rules:
- id: symfony-non-literal-redirect
  patterns:
  - pattern-either:
    - patterns:
      - pattern: $this->redirect(...)
      - pattern-not: $this->redirect("...")
      - pattern-not: $this->redirect()
    - patterns:
      - pattern: new RedirectResponse(...)
      - pattern-not: new RedirectResponse("...")
    - patterns:
      - pattern: $RESPONSE->setTargetUrl(...)
      - pattern-not: $RESPONSE->setTargetUrl("...")
  - pattern-either:
    - pattern-inside: |
        use Symfony\Component\HttpFoundation\RedirectResponse;
        ...
    - pattern-inside: |
        use Symfony\Bundle\FrameworkBundle\Controller\AbstractController;
        ...
    - pattern-inside: |
        use Symfony\Bundle\FrameworkBundle\Controller\Controller;
        ...
  message: >-
    The `redirect()` method does not check its destination in any way. If you redirect to a URL provided
    by end-users, your
    application may be open to the unvalidated redirects security vulnerability.
    Consider using literal values or an allowlist to validate URLs.
  languages: [php]
  metadata:
    references:
    - https://symfony.com/doc/current/controller.html#redirecting
    - https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    cwe:
    - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
    category: security
    technology:
    - symfony
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
    vulnerability_class:
    - Open Redirect
  severity: WARNING