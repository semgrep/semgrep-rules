rules:
  - id: fastify-cors-credentials-wildcard
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The `@fastify/cors` plugin is registered with `credentials: true`
      alongside an `origin` that reflects or allows any origin (`true` or
      `'*'`). Combining these two settings defeats the Same-Origin Policy
      entirely: the server will echo back whatever `Origin` header the
      browser sends while also telling the browser it's fine to include
      cookies and other credentials, so any website can make authenticated
      requests against this API on behalf of a logged-in user and read the
      response. Scope `origin` to an explicit allowlist of trusted domains
      (an array of strings, or a function that validates the incoming
      origin against a known set) whenever `credentials: true` is used.
    metadata:
      cwe:
        - "CWE-346: Origin Validation Error"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: MEDIUM
      subcategory: [audit]
      likelihood: MEDIUM
      impact: HIGH
      technology: [fastify]
      references:
        - https://github.com/fastify/fastify-cors#options
        - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
    patterns:
      - pattern-either:
          - pattern-inside: |
              import $CORS from '@fastify/cors'
              ...
          - pattern-inside: |
              import * as $CORS from '@fastify/cors'
              ...
          - pattern-inside: |
              const $CORS = require('@fastify/cors')
              ...
      - pattern: |
          $APP.register($CORS, { ..., origin: $ORIGIN, ..., credentials: true, ... })
      - metavariable-regex:
          metavariable: $ORIGIN
          regex: ^(true|'\*'|"\*")$
