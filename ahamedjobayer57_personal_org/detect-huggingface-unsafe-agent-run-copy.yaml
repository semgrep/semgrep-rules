rules:
- id: detect-huggingface-unsafe-agent-run-copy
  message: Semgrep found untrusted user input from a web request being passed to HuggingFace's
    `CodeAgent.run(...)`. This is unsafe and can lead to arbitrary code execution
    in the context of your agent process.
  severity: ERROR
  metadata:
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-77: Improper Neutralization of Special Elements used in a Command (''Command
      Injection'')'
    cwe2021-top25: true
    cwe2022-top25: true
    display-name: HuggingFace Code Agent with Untrusted User Input
    functional-categories:
    - ai::sink::llm_call::huggingface
    - serverless::source::function-params::aws-lambda
    - web::source::cookie::cherrypy
    - web::source::cookie::django
    - web::source::cookie::django_allauth
    - web::source::cookie::django_channels
    - web::source::cookie::django_rest_frameworkapi
    - web::source::cookie::fastapi
    - web::source::cookie::flask
    - web::source::form-data::cherrypy
    - web::source::form-data::django
    - web::source::form-data::django_allauth
    - web::source::form-data::django_channels
    - web::source::form-data::django_rest_frameworkapi
    - web::source::form-data::fastapi
    - web::source::form-data::flask
    - web::source::form-data::flask-wtf
    - web::source::form-data::wtforms
    - web::source::header::cherrypy
    - web::source::header::django
    - web::source::header::django_allauth
    - web::source::header::django_channels
    - web::source::header::django_rest_frameworkapi
    - web::source::header::fastapi
    - web::source::header::flask
    - web::source::http-body::cherrypy
    - web::source::http-body::django
    - web::source::http-body::django_allauth
    - web::source::http-body::django_channels
    - web::source::http-body::django_rest_frameworkapi
    - web::source::http-body::fastapi
    - web::source::http-body::flask
    - web::source::url-path-params::cherrypy
    - web::source::url-path-params::django
    - web::source::url-path-params::django_allauth
    - web::source::url-path-params::django_channels
    - web::source::url-path-params::django_rest_frameworkapi
    - web::source::url-path-params::fastapi
    - web::source::url-path-params::flask
    - web::source::url-query-string::cherrypy
    - web::source::url-query-string::django
    - web::source::url-query-string::django_allauth
    - web::source::url-query-string::django_channels
    - web::source::url-query-string::django_rest_frameworkapi
    - web::source::url-query-string::fastapi
    - web::source::url-query-string::flask
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    references:
    - https://huggingface.co/docs/transformers/en/main_classes/agent#transformers.CodeAgent
    - https://owasp.org/Top10/A03_2021-Injection
    technology:
    - aws
    - aws-lambda
    - cherrypy
    - cloud
    - django
    - django.views
    - django.views.generic
    - django_allauth
    - django_channels
    - django_rest_frameworkapi
    - fastapi
    - flask
    - flask-wtf
    - genAI
    - huggingface
    - llms
    - serverless
    - web
    - wtforms
