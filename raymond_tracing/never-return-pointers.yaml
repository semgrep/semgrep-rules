rules:
- id: never-return-pointers
  languages:
  - cpp
  severity: ERROR
  message: Prefer return types which have known ownership semantics to raw pointers
    such as references, std::unique_ptr or std::shared_ptr for single elements. For
    multiple elements use a view.
  patterns:
  - pattern-either:
    - pattern: $_* $F(...) { ... }
    - pattern: $_* $F(...);
  metadata:
    cwe:
    - CWE-465
    shortDescription: Avoid returning pointers in C++ code
    category: security
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
    subcategory:
    - audit
    technology:
    - --no-technlogy--
    references:
    - https://web.archive.org/web/20161012223329/http://www.securiteam.com/securitynews/5ZP0M1PIUI.html
  references:
  - https://web.archive.org/web/20161012223329/http://www.securiteam.com/securitynews/5ZP0M1PIUI.html
