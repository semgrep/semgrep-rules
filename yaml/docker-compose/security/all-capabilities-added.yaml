rules:
- id: all-capabilities-added
  patterns:
  - pattern-either:
    - pattern: |
        services:
          ...
          $SERVICE:
            ...
            cap_add:
              - ...
              - ALL
    - pattern: |
        services:
          ...
          $SERVICE:
            ...
            cap_add: [ALL]
  - focus-metavariable: $SERVICE
  message: >-
    Docker Compose service '$SERVICE' adds every Linux capability with
    'cap_add: ALL'. This removes capability-based privilege separation
    for the container. Grant only the specific capabilities required.
  metadata:
    cwe:
    - 'CWE-250: Execution with Unnecessary Privileges'
    owasp:
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://docs.docker.com/reference/compose-file/services/#cap_add
    - https://docs.docker.com/engine/containers/run/#runtime-privilege-and-linux-capabilities
    category: security
    technology:
    - docker-compose
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  languages: [yaml]
  severity: WARNING
