rules:
- id: sys-admin-capability-added
  patterns:
  - pattern-either:
    - pattern: |
        services:
          ...
          $SERVICE:
            ...
            cap_add:
              - ...
              - SYS_ADMIN
    - pattern: |
        services:
          ...
          $SERVICE:
            ...
            cap_add: [SYS_ADMIN]
    - pattern: |
        services:
          ...
          $SERVICE:
            ...
            cap_add:
              - ...
              - CAP_SYS_ADMIN
    - pattern: |
        services:
          ...
          $SERVICE:
            ...
            cap_add: [CAP_SYS_ADMIN]
  - focus-metavariable: $SERVICE
  message: >-
    ove SYS_ADMIN and grant only the narrow capabilities the service requires.
  metadata:
    cwe:
    - 'CWE-250: Execution with Unnecessary Privileges'
    owasp:
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://docs.docker.com/engine/containers/run/#runtime-privilege-and-linux-capabilities
    category: security
    technology:
    - docker-compose
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  languages: [yaml]
  severity: WARNING
