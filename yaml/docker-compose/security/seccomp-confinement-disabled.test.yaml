version: "3.9"
services:
  # ok: seccomp-confinement-disabled
  web:
    image: nginx:alpine
  # ok: seccomp-confinement-disabled
  worker:
    image: my-worker-image:latest
    security_opt:
      - label:user:testuser
  # ruleid: seccomp-confinement-disabled
  db:
    image: mysql
    security_opt:
      - seccomp:unconfined
---
services:
  # ruleid: seccomp-confinement-disabled
  versionless:
    image: alpine:latest
    security_opt:
      - seccomp:unconfined
---
name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # ok: seccomp-confinement-disabled
      docker:
        image: docker:dind
        security_opt:
          - seccomp:unconfined
