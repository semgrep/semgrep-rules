rules:
- id: host-user-namespace
  patterns:
  - pattern: |
      services:
        ...
        $SERVICE:
          ...
          userns_mode: host
  - focus-metavariable: $SERVICE
  message: >-
    Docker Compose service '$SERVICE' disables user namespace remapping for
    this container when daemon-level remapping is enabled. Retain remapping
    unless this exception is required and reviewed.
  metadata:
    cwe:
    - 'CWE-653: Improper Isolation or Compartmentalization'
    owasp:
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://docs.docker.com/engine/security/userns-remap/
    category: security
    technology:
    - docker-compose
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
  languages: [yaml]
  severity: WARNING
