rules:
- id: host-network-namespace
  patterns:
  - pattern: |
      services:
        ...
        $SERVICE:
          ...
          network_mode: host
  - focus-metavariable: $SERVICE
  message: >-
    Docker Compose service '$SERVICE' shares the host network namespace,
    bypassing container network isolation and exposing host network
    interfaces and services. Use an isolated network unless host networking
    is explicitly required.
  metadata:
    cwe:
    - 'CWE-653: Improper Isolation or Compartmentalization'
    owasp:
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://docs.docker.com/compose/how-tos/networking/
    category: security
    technology:
    - docker-compose
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
  languages: [yaml]
  severity: WARNING
