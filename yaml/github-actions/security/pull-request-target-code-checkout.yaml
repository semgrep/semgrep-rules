rules:
- id: pull-request-target-code-checkout
  languages:
  - yaml
  message: >-
    This `pull_request_target` workflow checks out fork-controlled code using a
    fork-head ref (`github.event.pull_request.head.sha`, `github.head_ref`,
    `github.event.pull_request.head.ref`, or a `refs/pull/` merge ref). The
    `pull_request_target` trigger executes with the base repository's secrets
    even for PRs from external forks. Checking out the attacker's fork code
    allows arbitrary code execution with access to repository secrets — this is
    the "Pwn Request" attack pattern. Remediate by: (1) using the
    `pull_request` trigger instead, (2) splitting into an upload/download
    pattern using `workflow_run`, or (3) pinning the checkout to the base
    branch without a `ref:` override.
  metadata:
    category: security
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software and Data Integrity Failures
    cwe:
    - 'CWE-829: Inclusion of Functionality from Untrusted Control Sphere'
    references:
    - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
    - https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
    - https://github.com/justinsteven/advisories/blob/master/2021_github_actions_checkspelling_token_leak_via_advice_symlink.md
    technology:
    - github-actions
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: HIGH
  patterns:
  - pattern-either:
    - pattern-inside: |
        on:
          ...
          pull_request_target: ...
          ...
        ...
    - pattern-inside: |
        on: [..., pull_request_target, ...]
        ...
    - pattern-inside: |
        on: pull_request_target
        ...
  - pattern: |
      ref: $REF
  - metavariable-regex:
      metavariable: $REF
      regex: '.*github\.event\.pull_request\.head\.(sha|ref)|.*github\.head_ref|refs/pull/'
  severity: ERROR
