# GitHub Actions workflow — test cases for gha-pwn-request-fork-checkout

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  # TP-1: github.event.pull_request.head.sha
  tp_sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-pwn-request-fork-checkout
          ref: ${{ github.event.pull_request.head.sha }}
      - run: go run ./tools/apidiff/...

  # TP-2: github.head_ref (shorthand form)
  tp_head_ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-pwn-request-fork-checkout
          ref: ${{ github.head_ref }}
      - run: npm test

  # TP-3: github.event.pull_request.head.sha || github.ref
  tp_sha_or_ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-pwn-request-fork-checkout
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - run: go vet ./...

  # TP-4: github.event.pull_request.head.ref (full path variant)
  tp_head_ref_full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-pwn-request-fork-checkout
          ref: ${{ github.event.pull_request.head.ref }}
      - run: make build

  # TN-1: No ref override — checks out base branch code (safe)
  tn_no_ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
