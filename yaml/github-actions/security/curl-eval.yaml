rules:
- id: curl-eval
  languages:
  - yaml
  message: Data is being eval'd from a `curl` command. An attacker with control of the server in the `curl`
    command could inject malicious code into the `eval`, resulting in a system comrpomise. Avoid eval'ing
    untrusted data if you can. If you must do this, consider checking the SHA sum of the content returned
    by the server to verify its integrity.
  metadata:
    category: security
    cwe:
    - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://docs.github.com/en/actions/learn-github-actions/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
    technology:
    - github-actions
    - bash
    - curl
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    confidence: LOW
  # Restrict bash nested parse to default-shell / bash / sh steps (issue #4001).
  patterns:
  - pattern-inside: 'steps: [...]'
  - pattern-either:
    - patterns:
      - pattern-inside: |
          - run: ...
            ...
      - pattern-not-inside: |
          - shell: ...
            ...
      - pattern: |
          run: $SHELL
    - patterns:
      - pattern-either:
        - pattern: |
            shell: bash
            ...
            run: $SHELL
        - pattern: |
            run: $SHELL
            ...
            shell: bash
        - pattern: |
            shell: sh
            ...
            run: $SHELL
        - pattern: |
            run: $SHELL
            ...
            shell: sh
  - focus-metavariable: $SHELL
  - metavariable-pattern:
      language: bash
      metavariable: $SHELL
      patterns:
      - pattern: |
          $DATA=<... curl ...>
          ...
          eval <... $DATA ...>

  severity: ERROR
