rules:
  - id: haskell_lang_cleartext_http_url
    languages: [generic]
    paths:
      include:
        - "*.hs"
    patterns:
      - pattern-regex: '(?<!\\)\"http://(?![^\"\s]*\.svc(?:\.cluster\.local)?[:/\"])(?!localhost\b|127\.0\.0\.1\b|0\.0\.0\.0\b|\[::1\]|www\.w3\.org/|schemas\.|xmlns\.|example\.(?:com|org)\b)[^\"\s]+\"'
      - pattern-not-regex: '(?m)^import\b[^\n]*(?:\n[ \t]+[^\n]*)*'
      - pattern-not-regex: '(?m)^module\b[\s\S]*?\bwhere\b'
      - pattern-not-regex: '\{-[\s\S]*?-\}'
      - pattern-not-regex: '(?m)^#[^\n]*'
      - pattern-not-regex: '(?<![!#$%&*+./<=>?@\\^|~:-])--+(?![!#$%&*+./<=>?@\\^|~:])[^\n]*'
    message: >-
      Hard-coded `http://` URL. Requests to it travel unencrypted, so card data, tokens and
      callback payloads can be read or modified by anyone on the network path (CWE-319).
      Use `https://`, and load per-environment endpoints from configuration instead of
      source.
    severity: INFO
    metadata:
      category: security
      technology:
        - haskell
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp:
        - A02:2021 - Cryptographic Failures
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      subcategory:
        - audit
      references:
        - https://cwe.mitre.org/data/definitions/319.html
