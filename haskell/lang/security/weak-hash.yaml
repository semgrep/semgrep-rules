rules:
  - id: haskell_lang_weak_hash
    languages: [generic]
    paths:
      include:
        - "*.hs"
    patterns:
      - pattern-regex: '(?<![A-Za-z0-9_''])(MD2|MD4|MD5|SHA1)(?![A-Za-z0-9_''])|(?<![A-Za-z0-9_''.])(md5|sha1)(?![A-Za-z0-9_''])'
      - pattern-not-regex: '(?m)^import\b[^\n]*(?:\n[ \t]+[^\n]*)*'
      - pattern-not-regex: '(?m)^module\b[\s\S]*?\bwhere\b'
      - pattern-not-regex: '\{-[\s\S]*?-\}'
      - pattern-not-regex: '(?m)^#[^\n]*'
      - pattern-not-regex: '(?<![!#$%&*+./<=>?@\\^|~:-])--+(?![!#$%&*+./<=>?@\\^|~:])[^\n]*'
      - pattern-not-regex: '"(?:[^"\\\n]|\\.)*"'
    message: >-
      Weak hash algorithm (`MD5`/`SHA1`, e.g. `hashWith MD5`, `Digest SHA1`, `MD5.hash`,
      `md5`). MD5 and SHA-1 are broken for collision resistance: an attacker can craft two
      inputs with the same digest, so they must not protect integrity, signatures,
      certificates or passwords (CWE-328).
      Use `SHA256`/`SHA512`/`Blake2b` from `crypton`, and a dedicated password hash
      (`Crypto.KDF.Argon2`, `bcrypt`) for credentials. HMAC-SHA1 required by a legacy
      partner API is still acceptable; mark that call with a `nosemgrep` comment.
    severity: WARNING
    metadata:
      category: security
      technology:
        - haskell
      cwe:
        - 'CWE-328: Use of Weak Hash'
      owasp:
        - A02:2021 - Cryptographic Failures
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      subcategory:
        - audit
      references:
        - https://hackage.haskell.org/package/crypton/docs/Crypto-Hash-Algorithms.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
