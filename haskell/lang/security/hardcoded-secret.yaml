rules:
  - id: haskell_lang_hardcoded_secret
    languages: [generic]
    paths:
      include:
        - "*.hs"
    patterns:
      - pattern-regex: '(?im)(?:^[ \t]*|[{,][ \t]*)[a-z0-9_'']*(?:password|passwd|secret|api_?key|private_?key|access_?token|auth_?token|signing_?key)[a-z0-9_'']*[ \t]*=[ \t]*(?:(?:[a-z0-9]+\.)?pack\s+|fromString\s+)?\"(?-i:(?![A-Z0-9_]+\"|[xX]-[A-Za-z0-9-]+\"))[^\"\n]{6,}\"'
      - pattern-not-regex: '(?m)^import\b[^\n]*(?:\n[ \t]+[^\n]*)*'
      - pattern-not-regex: '(?m)^module\b[\s\S]*?\bwhere\b'
      - pattern-not-regex: '\{-[\s\S]*?-\}'
      - pattern-not-regex: '(?m)^#[^\n]*'
      - pattern-not-regex: '(?<![!#$%&*+./<=>?@\\^|~:-])--+(?![!#$%&*+./<=>?@\\^|~:])[^\n]*'
    message: >-
      A credential-looking binding (`password`, `secret`, `apiKey`, `accessToken`,
      `signingKey`, ...) is assigned a string literal. Secrets in source end up in git
      history, build artefacts and logs, and cannot be rotated without a deploy (CWE-798).
      Load the value at runtime from the environment or a secret manager (e.g. `lookupEnv`,
      Vault, KMS), and keep test fixtures clearly fake.
    severity: ERROR
    metadata:
      category: security
      technology:
        - haskell
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      owasp:
        - A07:2021 - Identification and Authentication Failures
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      subcategory:
        - vuln
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
        - https://cwe.mitre.org/data/definitions/798.html
