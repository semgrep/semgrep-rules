rules:
  - id: haskell_lang_unchecked_unsafe_operation
    languages: [generic]
    paths:
      include:
        - "*.hs"
    patterns:
      - pattern-regex: '(?<![A-Za-z0-9_''])(unsafeHead|unsafeTail|unsafeLast|unsafeInit|unsafeIndex|unsafeIndexM|unsafeTake|unsafeDrop|unsafeRead|unsafeWrite|unsafeSlice|unsafeFreeze|unsafeThaw|unsafeIOToST|unsafeSTToIO|unsafeInterleaveST|inlinePerformIO|accursedUnutterablePerformIO|unsafeUseAsCString|unsafeUseAsCStringLen|unsafePackCString|unsafePackCStringLen|unsafePackMallocCString|unsafeFromForeignPtr|unsafeForeignPtrToPtr)(?![A-Za-z0-9_''])'
      - pattern-not-regex: '(?m)^import\b[^\n]*(?:\n[ \t]+[^\n]*)*'
      - pattern-not-regex: '(?m)^module\b[\s\S]*?\bwhere\b'
      - pattern-not-regex: '\{-[\s\S]*?-\}'
      - pattern-not-regex: '(?m)^#[^\n]*'
      - pattern-not-regex: '(?<![!#$%&*+./<=>?@\\^|~:-])--+(?![!#$%&*+./<=>?@\\^|~:])[^\n]*'
      - pattern-not-regex: '"(?:[^"\\\n]|\\.)*"'
    message: >-
      Unchecked "unsafe" operation from `bytestring`/`vector`/`text`/`primitive`
      (`unsafeIndex`, `unsafeHead`, `unsafeRead`/`unsafeWrite`, `unsafeFreeze`/`unsafeThaw`,
      `unsafeUseAsCString`, `inlinePerformIO`, ...). These skip bounds and aliasing checks;
      a wrong index or a mutation after freezing reads or corrupts arbitrary memory instead
      of throwing (CWE-125/CWE-787).
      Use the checked versions (`index`, `!?`, `read`, `freeze`, `useAsCString`) unless a
      benchmark shows the check matters, and document the invariant that makes the unchecked
      call safe next to it.
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - haskell
      cwe:
        - 'CWE-125: Out-of-bounds Read'
        - 'CWE-787: Out-of-bounds Write'
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      references:
        - https://hackage.haskell.org/package/bytestring/docs/Data-ByteString-Unsafe.html
        - https://hackage.haskell.org/package/vector/docs/Data-Vector-Unboxed.html
